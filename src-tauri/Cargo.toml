[package]
name = "campus-reconstruction-tool"
version = "0.1.0"
description = "Desktop shell for the Minecraft Campus Reconstruction Tool"
authors = ["Campus Reconstruction Tool contributors"]
edition = "2021"

[lib]
name = "campus_reconstruction_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
arnis-core = { path = "crates/arnis-core" }
tauri-plugin-dialog = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
