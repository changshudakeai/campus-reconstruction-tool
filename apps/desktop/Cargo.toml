# MCRebuild V2 —— S1 主程序应用壳（T19 Phase1）
#
# 职责：零业务逻辑的 Slint 薄壳——声明主窗口、判定首开着陆去向
# （首次向导 / 老用户直达 / 校区选择），文案全部经 B6 注入（ADR-0005）。
# T19B-1：ViewModelInjector 构造并持有全部 F 模块实例，把视图状态
# 注入 Slint 属性；页面级接线与导航骨架（ADR-0027）归 T19B-2..8。
#
# ⚖️ 本依赖段即白名单：壳只准依赖 F1-F9、B1-B7、B9-B11、B17 与 slint
# （ADR-0017 + ADR-0025，xtask arch 断言 2 强制）。slint 仅本 crate 可依
# （deny.toml bans wrappers）。

[package]
name = "desktop-shell"
version.workspace = true
edition.workspace = true
publish = false
description = "S1 主程序应用壳：Slint 薄壳 UI + 首开着陆判定，零业务逻辑（ADR-0017）"

[[bin]]
name = "campus-tool-dev"
path = "src/main.rs"

[build-dependencies]
# ui/main.slint → 生成 Rust 绑定（slint::include_modules! 引入）
slint-build = { workspace = true }

[dependencies]
# UI 框架（唯一合法使用者，ADR-0017 三层锁）
slint = { workspace = true }
# B6 国际化（窗口标题与状态文案，文本外置铁律 ADR-0005）
localization = { workspace = true }
# F1 全局设置（首次运行判定 + 老用户着陆校区）
global-settings = { workspace = true }
# F2 新手教程（引导进度装载；气泡接线归后续 T19B 工单）
onboarding-tutorial = { workspace = true }
# F3 项目方案管理（校区/方案 CRUD ViewModel，自持 B2 连接）
project-management = { workspace = true }
# F4 数据采集流水线（内含 B13 归类引擎，壳不直接碰 B13）
data-acquisition = { workspace = true }
# F5 评审工作台（按方案进台会话，缝 4）
review-workbench = { workspace = true }
# F7 覆盖率审计安静哨兵
coverage-audit = { workspace = true }
# F9 导出控制台（门控占位，真门控随 T19B-8 落地）
export-console = { workspace = true }
# B1 共享领域类型（ADR-0025 例外授权：仅类型层面只读使用）
shared-domain-types = { workspace = true }
# B2 数据持久化（仅用于打开数据库并交给 F 模块，不直接碰 SQL）
data-persistence = { workspace = true }
# B7 通知中心（回调错误统一分派，弹窗铁律 ADR-0021）
notification-center = { workspace = true }
# 错误链路
anyhow = { workspace = true }

[dev-dependencies]
# 跨模块落库断言用同一临时文件连接组（内存库两连接各自独立）
tempfile = { workspace = true }

[lints]
workspace = true
