# MCRebuild V2 —— S1 主程序应用壳（T19 Phase1）
#
# 迁移期职责：声明主窗口并绑定可观察页面状态；现有首开判定与流程协调
# 仅作为工单 01 行为基线保留，不授权新增 S1 业务逻辑（ADR-0037）。
#
# ⚖️ 下列依赖是迁移期现状清单，不是白名单。ADR-0037 的目标态只允许呈现接口、
# 共享展示类型与呈现能力；不得新增持久化、生成或导出实现依赖。后续工单负责
# 迁出 B2/B17/B18 等业务实现并收紧架构检查，本工单不删除依赖或改变行为。
[package]
name = "desktop-shell"
version.workspace = true
edition.workspace = true
publish = false
description = "S1 主程序应用壳：Slint 页面状态、导航与通知呈现（ADR-0037）"

[[bin]]
name = "campus-tool-dev"
path = "src/main.rs"

[build-dependencies]
# ui/main.slint → 生成 Rust 绑定（slint::include_modules! 引入）
slint-build = { workspace = true }

[dependencies]
# UI 框架（唯一合法使用者，ADR-0017 三层锁）
slint = { workspace = true }
# B3 + S1: 高德地图 WebView 嵌入（winit 版本差经 raw-window-handle 桥接）
wry = { workspace = true }
raw-window-handle = { workspace = true }
# B6 国际化（窗口标题与状态文案，文本外置铁律 ADR-0005）
localization = { workspace = true }
# T19B-5B: B5 地基模式 (边界绘制与朝向设定)
foundation-mode = { workspace = true }
# T24: B3 高德地图客户端（边界地图页生成 + IPC 协议解析 + OSM 元素类型）
gaode-client = { workspace = true }
# F1 全局设置 (首次运行判定 + 老用户着陆校区)
global-settings = { workspace = true }
# F2 新手教程（引导进度装载；气泡接线归后续 T19B 工单）
onboarding-tutorial = { workspace = true }
# F3 项目方案管理（校区/方案 CRUD ViewModel，自持 B2 连接）
project-management = { workspace = true }
# F4 数据采集（仅用于构造生产 DataSource 适配器并注入 A1，不承载编排）
data-acquisition = { workspace = true }
# F5 评审工作台（按方案进台会话，缝 4）
review-workbench = { workspace = true }
# F9 导出控制台（门控占位，真门控随 T19B-8 落地）
export-flow = { workspace = true }
# A1 候选采集完整用例（F4 → B2 → B14 → F7 在入口后协调，S1 只转发意图）
collection-flow = { workspace = true }
# B1 共享领域类型（ADR-0025 例外授权：仅类型层面只读使用）
shared-domain-types = { workspace = true }
# B2 数据持久化（仅用于打开数据库并交给 F 模块，不直接碰 SQL）
data-persistence = { workspace = true }
# B7 通知中心（回调错误统一分派，弹窗铁律 ADR-0021）
notification-center = { workspace = true }
# 错误链路
anyhow = { workspace = true }
# 色卡 JSON 解析（ADR-0023 色卡资源文件加载，workspace 已有依赖）
serde_json = { workspace = true }
# 相对时间格式化（ADR-0018 §一第 3 条，解析 RFC3339 时间戳，workspace 已有依赖）
chrono = { workspace = true }
# 日志（色卡加载警告）
log = { workspace = true }

[dev-dependencies]
# 跨模块落库断言用同一临时文件连接组（内存库两连接各自独立）
manifest-generator = { workspace = true }
sponge-export = { workspace = true }
tempfile = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["wry", "raw-window-handle"]
# T21 slint 1.9 暂存实现，slint 1.17+ 升级后正式启用 WebView 嵌入

[lints]
workspace = true
