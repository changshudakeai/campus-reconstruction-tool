# MCRebuild V2 —— B4 Sponge 导出引擎（.schem 落盘）
#
# 职责：复用 v1.x Sponge V3 导出引擎，输入方块模型 → 输出 .schem 文件（NBT 编码 + gzip 压缩）。
#
# 依据 ADR-0003（复用 v1.x 核心引擎）、ADR-0024（仅 .schem 格式、平地 + 高度扩展位）。
# ⚖️ 本 crate 是"打印机"：零业务逻辑、零生成规则、零数据库。只负责文件格式的读写。
# 不依赖 core/generation-engine（两模块互不依赖，缝 6 规定）。
# 可复用 T02 shared-domain-types 的类别枚举。
#
# 导入数据由 F9 适配后传入：方块坐标 + 方块 ID 列表（B5 提供边界和用料表）。

[package]
name = "sponge-export"
version.workspace = true
edition.workspace = true
publish = false
description = "B4 Sponge 导出引擎：.schem 文件格式 (.NBT/Gzip) 读写器"

[dependencies]
# serde JSON 序列化（往返校验的稳定哈希输入）
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# fastnbt NBT 编解码（v1.x campus-export 已验证）
fastnbt = { workspace = true }
# flate2 GZip 压缩（Sponge V3 要求 gzip 包裹 NBT）
flate2 = { workspace = true }
# sha2 内容哈希校验
sha2 = { workspace = true }
# anyhow 错误处理
anyhow = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# public-api snapshot testing
public-api = { workspace = true }
# tempfile for temporary test directories
tempfile = { workspace = true }
