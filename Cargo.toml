# MCRebuild V2 —— Rust workspace 根清单
#
# 依据 ADR-0001（模块化单体）：最终交付一个桌面应用，内部按业务能力
# 划分为独立模块（crate），修改单个模块只需重新编译该模块。
#
# 模块目录以 ADR-0017（+ ADR-0024 新增 B18）为准：共 30 个 crate——
# 1 个薄壳主程序（apps/desktop）+ 7 功能模块 + 17 基础模块 + xtask。
# 实施顺序铁律：第一批工单先搭“三层锁”执法地基（xtask tidy/架构测试、
# deny.toml、workspace.lints、CI），任何功能模块动工前完成。
# 详见 docs/adr/0017、0024 与 docs/research/module-boundary-enforcement.md。
#
# ⚖️ 本文件是执法文件（调研报告 §1.1）：各 crate 的 [dependencies] 即
# 依赖白名单，未声明的 crate 无法 `use`（编译失败）。改动任何 Cargo.toml
# 的依赖段都受 CODEOWNERS 守卫（.github/CODEOWNERS）。
#
# 注意：模块目录建立并通过接口评审后，才加入下方 members 列表。

[workspace]
resolver = "2"
members = [
    # T18: B10 主题与动画
    "core/theming",
    # T04: F3 项目方案管理（方案 CRUD + ViewModel）
    "core/project-management",
    # T11：B2 数据持久化核心（原始观测表 + 评审终态 + 回收站）
    "core/data-persistence",
    # T06：F5 候选审核工作台（三态评审 + 三栏布局 ViewModel + 封账写回）
    "core/review-workbench",
    # T07：F9 导出控制台（封账确认 + 非阻塞进度条）
    "core/export-console",
    # T12：B13 数据转换器（标签映射表 + 六类别归类）
    "core/data-transformers",
    # T13：F4 数据采集（可插拔数据源 + 增量刷新检测 + 原始观测落库）
    "core/data-acquisition",
    # T03: B6 国际化模块
    "core/localization",
    # T02：B1 共享领域类型
    "core/shared-domain-types",
    # T14: B5 地基模式（边界绘制与朝向设定）
    "core/foundation-mode",
    # T15：B7 通知中心（弹窗铁律 + 公告栏铃铛）
    "core/notification-center",
    # T09：B4 Sponge 导出引擎（.schem 落盘）
    "core/sponge-export",
    # T05：F1 应用全局设置（语言/MC 版本 + 首次向导 + 上次使用的校区）
    "core/global-settings",
    # T05：B3 高德地图客户端（POI 搜索解析 + 校区确认流程 + 地图页）
    "core/gaode-client",
    # S2 构建与自动化（三层锁执法地基，T01）
    "xtask", "core/manifest-generator",
    # T10: B18 初始校园生成引擎 (刚刚创建)
    "core/generation-engine",
    # T16：F7 覆盖率审计（安静哨兵 + 两条疑点规则）
    "core/coverage-audit",
    # s1-21: B14 候选几何校验（仅采集候选，不接管 B5 方案边界）
    "core/geometry-validator",
    # T17：F2 新手教程（跟练式气泡引导 + 四条规矩）
    "core/onboarding-tutorial",
    # T19: S1 主程序应用壳（Slint UI 薄壳）
    "apps/export-flow",
    # A1: 候选采集完整用例（非 S1 应用流程模块，ADR-0039/0040）
    "apps/collection-flow",
    "apps/desktop",
]
[workspace.package]
version = "2.0.0-dev"
edition = "2021"

# ── 依赖版本单点管理（执法清单 1.2）─────────────────────────────
# 全部外部依赖版本只在此处声明一次，成员 crate 用 `workspace = true`
# 继承；成员私自声明版本会被 cargo-deny（workspace-dependencies
# duplicates = 'deny'）拦截。此处声明但无人使用同样报错（unused = 'deny'）。
[workspace.dependencies]
anyhow = "1"
cargo_metadata = "0.19"
# B6 国际化
serde_json = "1"
serde = { version = "1", features = ["derive"] }
once_cell = "1.19"
log = "0.4"
# B1 共享领域类型
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
# Windows registry access for system theme detection (theming/B10)
winreg = "0.55"
# B5 地基模式：几何面积计算
geo = "0.28"
# B4 Sponge 导出：NBT 编解码 + gzip 压缩 + 内容哈希（ADR-0003 自 v1.x 迁入）
fastnbt = "2"
flate2 = "1"
sha2 = "0.10"
# T19 S1 UI 框架 (slint 只准 desktop-shell 依赖，deny.toml 已配置 bans)。
# 用官方默认 features（winit 后端 + femtovg/软件渲染器 + 无障碍），
# 关掉默认 features 会没有窗口后端，桌面应用无法启动。
# T21 FINAL: 启用 winit_030 模块以支持 WebView 嵌入
slint = { version = "1.9", features = ["unstable-winit-030"] }
slint-build = "1.9"
# B3 + S1: wry WebView + raw-window-handle（高德地图嵌入）
wry = "0.55"
raw-window-handle = "0.6"
# T21 FINAL: 用于 block_on(slhint_window.winit_window())
futures-executor = "0.3"
# T31: OSM/Overpass/Nominatim Rust 侧直连（绕开 WebView CORS；端点回退）
# 默认 rustls 会引入 webpki-roots（CDLA-Permissive-2.0 不在 deny 白名单）；
# Windows 桌面改用系统 TLS（native-tls/schannel），避免新增许可豁免。
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }
# ureq 2.12 的 native-tls 仅为适配器，需显式传入 TlsConnector（仅 data-acquisition 使用）
native-tls = "0.2"
# 测试临时目录
tempfile = "3"
# RFC3339 时间戳（F2 引导完成时刻；B2 同版本同特性直接声明，同 sha2 先例）
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# path 依赖（workspace-dependencies bans 需要）
data-persistence = { path = "core/data-persistence" }
notification-center = { path = "core/notification-center" }
sponge-export = { path = "core/sponge-export" }
review-workbench = { path = "core/review-workbench" }
generation-engine = { path = "core/generation-engine" }
manifest-generator = { path = "core/manifest-generator" }
data-transformers = { path = "core/data-transformers" }
gaode-client = { path = "core/gaode-client" }
# 构建自动化（xtask is not a regular crate）
xtask = { path = "xtask" }
# public-api snapshot testing
public-api = "0.50.1"
rustdoc-json = "0.9.10"
# 路径依赖
shared-domain-types = { path = "core/shared-domain-types" }
localization = { path = "core/localization" }
foundation-mode = { path = "core/foundation-mode" }
global-settings = { path = "core/global-settings" }
# T19B-1：壳 VM 注入器持有的 F 模块（apps/desktop 依赖段引用）
onboarding-tutorial = { path = "core/onboarding-tutorial" }
project-management = { path = "core/project-management" }
data-acquisition = { path = "core/data-acquisition" }
coverage-audit = { path = "core/coverage-audit" }
geometry-validator = { path = "core/geometry-validator" }
export-console = { path = "core/export-console" }
export-flow = { path = "apps/export-flow" }
collection-flow = { path = "apps/collection-flow" }

# ── lint 门禁（执法清单 1.3 / 1.6，抄 zed / rust-analyzer / bevy 并集）──
# 成员 crate 写 `[lints] workspace = true` 继承。
# 双档模式：本地 warn 档正常开发，CI 用 RUSTFLAGS=-D warnings 提到 deny 档。
[workspace.lints]

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"     # 写了 pub 但 crate 外够不到 → 改 pub(crate)（十戒第 4 条）
unused_lifetimes = "warn"

[workspace.lints.clippy]
# 调试残留与半成品：禁止入主干
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"        # 面向用户的输出走通知中心/诊断日志；xtask 按豁免纪律带 reason 放行
print_stderr = "deny"
# 隐式耦合
wildcard_imports = "warn"    # 禁 use foo::*（CI 提为 deny）
# 越层直呼底层库（禁用表见根 clippy.toml，每条带 reason + replacement）
disallowed_types = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
# 豁免留痕纪律（执法清单 3.3）：任何 #[allow] 必须写 reason = "…"
allow_attributes_without_reason = "deny"

# 开发构建：优先编译速度（v1.x 的 20-30 分钟编译是重写首要动因）
[profile.dev]
incremental = true

# 发布构建：优先体积与运行效率（"轻便高效"目标）
[profile.release]
lto = "thin"
opt-level = "s"
strip = "symbols"
