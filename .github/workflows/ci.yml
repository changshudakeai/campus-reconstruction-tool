# MCRebuild V2 —— CI 三层锁的第二层（执法清单 2.x，仿 rust-analyzer/zed/bevy）
#
# 编排模式：检查逻辑写在 xtask（Rust）里，YAML 只是启动器；
# 末尾 conclusion 聚合 job 是唯一的 required status check（执法清单 2.8/6.3）
# ——新增检查只改本文件的 needs 清单，不动仓库设置。
#
# ⚠️ 新增 job 时务必同步更新 conclusion 的 `needs` 列表！

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 格式门禁（本地 warn、CI deny 双档的 CI 档）────────────────
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── clippy 全量 lint（-D warnings 把 workspace.lints 的 warn 档提为 deny）──
  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 测试（含 xtask 内的执法测试：tidy 全量扫描 + 架构断言）────
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # ── xtask tidy + 架构测试（独立 job，违规信息直接可读）────────
  xtask:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --package xtask -- ci

  # ── 编译时间预算（单编译单元 >2 分钟 → ::warning:: 注解，不阻断）──
  timings:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --package xtask -- timings

  # ── 未用依赖 = 依赖白名单腐化（执法清单 2.4，zed/ra 均用）─────
  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  # ── cargo-deny 四连（执法清单 2.3，bevy dependencies.yml 模式）──
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks: [advisories, bans, licenses, sources]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  # ── 聚合 job：分支保护唯一的 required check（仿 rust-analyzer）──
  conclusion:
    needs: [rustfmt, clippy, test, xtask, timings, machete, dependencies]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 全部检查必须 success 或 skipped
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq --exit-status 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
