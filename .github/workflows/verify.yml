name: verify-v1

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-v1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            src-tauri/crates/arnis-core
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: cargo fmt --manifest-path src-tauri/crates/arnis-core/Cargo.toml --all -- --check
      - run: cargo test --manifest-path native/Cargo.toml --workspace
      - run: cargo test --manifest-path src-tauri/crates/arnis-core/Cargo.toml
      - run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo clippy --manifest-path src-tauri/crates/arnis-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --manifest-path native/Cargo.toml --workspace --release

  web-reference:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - run: npm run test:offline-contracts
