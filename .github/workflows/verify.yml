name: verify-v1-1

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-v1-1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run test:release-contract
      - run: python -m unittest services/test_deployment_contract.py
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: cargo test --manifest-path native/Cargo.toml --workspace --locked
      - run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo build --manifest-path native/Cargo.toml --workspace --release --locked
