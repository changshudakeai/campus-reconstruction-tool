# MCRebuild V2 —— cargo-deny 配置（执法清单 2.3，抄 bevy 作业）
#
# 四类检查各在 CI 独立成 job（.github/workflows/ci.yml dependencies 矩阵）：
#   cargo deny check advisories / bans / licenses / sources
#
# 本文件受 CODEOWNERS 守卫：想给自己开豁免，先过守门人。
# 引入新的重依赖时，必须同步考虑是否要加 [bans] 越级直呼禁令
# （模式：deny 该 crate + wrappers 白名单放行唯一合法使用者）。

[graph]
all-features = true

# ── 漏洞与维护公告 ─────────────────────────────────────────────
[advisories]
yanked = "deny"

# ── 许可证白名单（新依赖带新许可证 = CI 红灯，仿 rust-analyzer）──
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "Zlib",
]
confidence-threshold = 0.93
# workspace 成员均为内部 crate（publish = false），不参与许可证审查
private = { ignore = true }

# ── 依赖关系禁令（重依赖越级直呼 = CI 红灯）───────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny" # 禁 version = "*"
deny = [
    # SQLite 只准 B2 data-persistence 直接依赖（ADR-0002/0017 红线表）；
    # 其余 crate 想碰数据库，必须走 B2 的存储接口。
    { crate = "rusqlite", wrappers = ["data-persistence"] },
    # UI 框架只准 S1 薄壳直接依赖（ADR-0017：功能/基础模块不碰 UI）。
    { crate = "slint", wrappers = ["desktop-shell"] },
]

# 版本单点管理兜底（执法清单 1.2）：
# 成员 crate 不用 workspace = true 而私自声明版本 → 报错；
# [workspace.dependencies] 声明了但没人用 → 报错。
[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

# ── 依赖来源白名单 ─────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
