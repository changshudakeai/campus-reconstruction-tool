<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>一次性原型 — V1.1 整体产品路线</title>
  <style>
    /*
      THROWAWAY PROTOTYPE
      Three overall V1.1 product-flow variants, switchable via ?variant=A|B|C.
      The question: which overall shell makes the campus-first route, evidence
      review, recovery, and export easiest to understand as one product?
    */
    :root {
      --ink: #17231e;
      --muted: #657169;
      --forest: #1f4939;
      --forest-2: #34705a;
      --forest-3: #dcebe3;
      --paper: #fffdf7;
      --cream: #f3efe4;
      --warm: #e9e1d2;
      --line: #cfc4b1;
      --line-soft: #e5ddcf;
      --red: #a44937;
      --red-soft: #f4ddd5;
      --gold: #926f1f;
      --gold-soft: #f2e6bd;
      --blue: #315d78;
      --blue-soft: #dce9ef;
      --shadow: 0 20px 54px rgba(26, 43, 34, .14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--cream); color: var(--ink); }
    body { font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(164, 73, 55, .3); outline-offset: 2px;
    }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1 { font-size: clamp(28px, 3vw, 42px); line-height: 1.12; margin-bottom: 12px; }
    h2 { font-size: 24px; margin-bottom: 8px; }
    h3 { font-size: 17px; margin-bottom: 6px; }
    h4 { font-size: 14px; margin-bottom: 5px; }
    p { line-height: 1.58; }
    .muted { color: var(--muted); }
    .tiny { font-size: 12px; }
    .small { font-size: 13px; }
    .mono { font-family: Consolas, "SFMono-Regular", monospace; }
    .eyebrow {
      color: var(--red); font-size: 11px; font-weight: 900;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .prototype-banner {
      min-height: 30px; padding: 6px 14px; display: flex; justify-content: center;
      align-items: center; background: #13221b; color: #f8f2e3;
      font-size: 11px; letter-spacing: .08em; text-align: center;
    }
    .app { min-height: calc(100vh - 30px); padding-bottom: 100px; }
    .topbar {
      min-height: 66px; display: flex; align-items: center; gap: 12px; padding: 10px 22px;
      border-bottom: 1px solid var(--line); background: rgba(255,253,247,.94);
      position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px);
    }
    .brand { font-size: 18px; font-weight: 900; white-space: nowrap; }
    .brand-mark {
      width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px;
      background: var(--forest); color: white; font-weight: 900;
    }
    .divider { height: 28px; width: 1px; background: var(--line); }
    .spacer { flex: 1; }
    .context-line { min-width: 0; }
    .context-line strong, .context-line span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .context-line span { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .button-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
      border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      padding: 9px 13px; border-radius: 8px; font-weight: 700;
    }
    .btn:hover { border-color: var(--forest-2); background: #fbf7ed; }
    .btn.primary { background: var(--forest); color: white; border-color: var(--forest); }
    .btn.primary:hover { background: var(--forest-2); }
    .btn.danger { color: var(--red); background: #fff9f6; border-color: #d9b0a6; }
    .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .btn.compact { padding: 6px 9px; font-size: 12px; }
    .btn:disabled { cursor: not-allowed; opacity: .45; }
    .pill {
      display: inline-flex; gap: 6px; align-items: center; padding: 5px 9px;
      border-radius: 999px; background: var(--forest-3); color: #285543;
      font-size: 11px; font-weight: 800;
    }
    .pill.warn { background: var(--gold-soft); color: #725817; }
    .pill.error { background: var(--red-soft); color: #843724; }
    .pill.blue { background: var(--blue-soft); color: var(--blue); }
    .pill.neutral { background: #ebe6dc; color: #626962; }
    .card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 8px 26px rgba(35, 52, 43, .06);
    }
    .card-pad { padding: 20px; }
    .soft-panel { padding: 14px; border: 1px solid var(--line-soft); background: #faf7ef; border-radius: 10px; }
    .map {
      min-height: 330px; position: relative; overflow: hidden; border-radius: 12px;
      border: 1px solid #c9c4b4; background:
        radial-gradient(circle at 72% 24%, rgba(74,130,99,.18) 0 12%, transparent 13%),
        linear-gradient(114deg, transparent 0 44%, rgba(95,114,103,.18) 45% 47%, transparent 48%),
        linear-gradient(26deg, transparent 0 52%, rgba(122,139,130,.18) 53% 55%, transparent 56%),
        repeating-linear-gradient(45deg, transparent 0 34px, rgba(70,89,79,.06) 35px 36px),
        #e9e7dc;
    }
    .map::before {
      content: ""; position: absolute; inset: 17% 15% 18% 18%;
      border: 3px solid var(--red); background: rgba(164,73,55,.08);
      clip-path: polygon(8% 12%, 68% 2%, 96% 31%, 85% 88%, 32% 96%, 3% 61%);
    }
    .map.unavailable::before { display: none; }
    .map-label {
      position: absolute; left: 14px; bottom: 14px; padding: 7px 10px;
      border-radius: 7px; background: rgba(255,253,247,.92); font-size: 11px;
      border: 1px solid var(--line);
    }
    .map-candidate {
      position: absolute; padding: 5px 8px; border-radius: 999px; font-size: 10px;
      background: var(--paper); border: 1px solid var(--line); box-shadow: 0 5px 12px rgba(0,0,0,.1);
    }
    .map-candidate.one { left: 34%; top: 23%; }
    .map-candidate.two { left: 62%; top: 47%; }
    .map-candidate.three { left: 27%; top: 65%; }
    .progress { height: 7px; border-radius: 999px; background: #ddd6c8; overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--forest-2); transition: width .2s; }
    .notice {
      display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px;
      border: 1px solid #d8c78d; background: #fbf4d9; border-radius: 9px; color: #664f14;
    }
    .notice.error { border-color: #d7aa9e; background: #fff2ed; color: #7e3422; }
    .notice.info { border-color: #aac4d2; background: #eef7fa; color: #2e566d; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { padding: 12px; border-radius: 9px; background: #f4efe4; }
    .stat strong { display: block; font-size: 18px; }
    .list { display: grid; gap: 9px; }
    .list-item {
      padding: 12px; border: 1px solid var(--line-soft); border-radius: 9px;
      background: var(--paper); transition: .15s;
    }
    button.list-item { width: 100%; text-align: left; color: inherit; }
    .list-item:hover, .list-item.active { border-color: var(--forest-2); background: #f3f8f4; }
    .list-item.error { border-color: #d9b0a6; background: #fff7f4; }
    .row { display: flex; align-items: center; gap: 9px; }
    .row.start { align-items: flex-start; }
    .row.wrap { flex-wrap: wrap; }
    .row.between { justify-content: space-between; }
    .grow { flex: 1; min-width: 0; }
    .stage-title { margin-bottom: 18px; }
    .route-steps { display: flex; align-items: stretch; overflow: auto; }
    .route-step {
      min-width: 128px; flex: 1; padding: 13px 12px; border-bottom: 3px solid var(--line);
      color: var(--muted); background: rgba(255,255,255,.25);
    }
    .route-step strong { display: block; font-size: 12px; }
    .route-step span { font-size: 10px; }
    .route-step.done { border-color: var(--forest-2); color: var(--forest); }
    .route-step.current { border-color: var(--red); color: var(--ink); background: var(--paper); }
    .route-step.locked { opacity: .45; }

    /* Variant A — route-first studio */
    .variant-a .route-shell { max-width: 1440px; margin: 0 auto; padding: 0 24px 34px; }
    .variant-a .route-steps { margin: 0 -24px 24px; padding: 0 24px; background: #e8e1d4; }
    .variant-a .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 18px; }
    .variant-a .main-stage { min-width: 0; }
    .variant-a .context-panel { position: sticky; top: 84px; align-self: start; display: grid; gap: 12px; }

    /* Variant B — map-first field notebook */
    .variant-b { background: #e8e4d8; }
    .variant-b .field-shell { min-height: calc(100vh - 96px); display: grid; grid-template-columns: 190px minmax(0, 1fr); }
    .variant-b .field-rail { padding: 22px 14px; color: #eef5f0; background: #1b3b2f; }
    .variant-b .field-rail .eyebrow { color: #efb29f; }
    .variant-b .vertical-step {
      width: 100%; border: 0; border-left: 3px solid rgba(255,255,255,.16);
      background: transparent; color: #b8c8c0; text-align: left; padding: 12px 10px; font-size: 12px;
    }
    .variant-b .vertical-step.done { border-color: #71a789; color: #e2eee8; }
    .variant-b .vertical-step.current { border-color: #ef9e88; background: rgba(255,255,255,.08); color: white; }
    .variant-b .field-main { position: relative; padding: 22px; min-width: 0; }
    .variant-b .field-main > .stage-frame { max-width: 1220px; margin: 0 auto; }
    .variant-b .floating-context {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
    }

    /* Variant C — evidence cockpit */
    .variant-c { background: #eff0eb; }
    .variant-c .cockpit { max-width: 1560px; margin: 0 auto; padding: 18px 20px 34px; }
    .variant-c .cockpit-grid { display: grid; grid-template-columns: 245px minmax(0, 1fr) 300px; gap: 14px; }
    .variant-c .mission, .variant-c .evidence-dock { align-self: start; position: sticky; top: 84px; }
    .variant-c .mission { overflow: hidden; }
    .variant-c .mission-head { padding: 16px; background: var(--forest); color: white; }
    .variant-c .mission-step { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); font-size: 12px; }
    .variant-c .mission-step.current { background: var(--red-soft); color: #763321; font-weight: 800; }
    .variant-c .mission-step.done::before { content: "✓ "; color: var(--forest-2); font-weight: 900; }
    .variant-c .evidence-dock { display: grid; gap: 12px; }

    /* Stage content */
    .campus-confirm { display: grid; grid-template-columns: 1.15fr .85fr; gap: 18px; }
    .campus-copy { padding: 28px; }
    .campus-map { min-height: 330px; border-radius: 0 14px 14px 0; }
    .project-table { overflow: hidden; }
    .table-head, .project-row {
      display: grid; grid-template-columns: 1.5fr .7fr 1fr 1.2fr; gap: 14px; align-items: center;
      padding: 14px 17px; border-bottom: 1px solid var(--line-soft);
    }
    .table-head { background: #eee8dc; color: var(--muted); font-size: 11px; font-weight: 800; }
    .project-row:last-child { border-bottom: 0; }
    .project-row:hover { background: #fbf8f0; }
    .boundary-grid { display: grid; grid-template-columns: 230px minmax(0,1fr) 270px; gap: 12px; }
    .boundary-column { min-width: 0; }
    .boundary-column .card { height: 100%; }
    .boundary-map { min-height: 440px; }
    .review-grid { display: grid; grid-template-columns: 280px minmax(0,1fr) 280px; gap: 12px; }
    .review-map { min-height: 460px; }
    .layer-tabs { display: flex; gap: 6px; overflow: auto; padding: 10px; border-bottom: 1px solid var(--line-soft); }
    .layer-tab {
      border: 1px solid var(--line); background: var(--paper); border-radius: 999px;
      padding: 7px 10px; white-space: nowrap; font-size: 11px; font-weight: 800;
    }
    .layer-tab.active { background: var(--forest); color: white; border-color: var(--forest); }
    .layer-tab.done::before { content: "✓ "; }
    .queue { max-height: 410px; overflow: auto; padding: 10px; }
    .review-footer {
      display: flex; gap: 12px; align-items: center; padding: 14px;
      border-top: 1px solid var(--line); background: #f6f1e7;
    }
    .generate-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; }
    .preview {
      min-height: 360px; border-radius: 12px; position: relative; overflow: hidden;
      background:
        linear-gradient(30deg, transparent 49%, rgba(255,255,255,.13) 50%, transparent 51%),
        linear-gradient(150deg, transparent 49%, rgba(255,255,255,.12) 50%, transparent 51%),
        #253c32;
    }
    .voxel {
      position: absolute; width: 44px; height: 34px; background: #b9a57e;
      border: 2px solid rgba(0,0,0,.2); transform: skewY(-12deg);
      box-shadow: inset -8px -8px rgba(0,0,0,.08);
    }
    .export-step { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
    .export-step:last-child { border-bottom: 0; }
    .step-icon {
      flex: 0 0 auto; width: 27px; height: 27px; display: grid; place-items: center;
      border-radius: 50%; background: #e6e1d7; color: var(--muted); font-size: 12px; font-weight: 900;
    }
    .export-step.done .step-icon { background: var(--forest-3); color: var(--forest); }

    /* Prototype controls */
    .switcher {
      position: fixed; z-index: 90; left: 50%; bottom: 17px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 9px; padding: 7px 10px;
      border-radius: 999px; background: #111e18; color: white;
      box-shadow: 0 14px 38px rgba(0,0,0,.34);
    }
    .switcher button {
      width: 36px; height: 36px; border: 0; border-radius: 50%;
      background: #365246; color: white; font-size: 17px;
    }
    .switch-label { min-width: 238px; text-align: center; font-size: 12px; }
    .debug {
      position: fixed; z-index: 80; left: 14px; bottom: 14px; width: 280px;
      max-height: 210px; overflow: auto; padding: 10px 12px; border-radius: 9px;
      border: 1px dashed #806f58; background: rgba(255,253,247,.96);
      color: #4f5d55; font: 10px/1.45 Consolas, monospace;
      box-shadow: 0 8px 24px rgba(0,0,0,.1);
      pointer-events: none;
    }
    .debug[hidden] { display: none; }
    .switcher .state-toggle { width: auto; padding: 0 11px; border-radius: 999px; font-size: 11px; }
    .toast {
      position: fixed; z-index: 100; right: 18px; top: 82px; max-width: 430px;
      padding: 12px 15px; border-radius: 9px; background: #17251f; color: white;
      box-shadow: var(--shadow); font-size: 13px;
    }
    .modal-backdrop {
      position: fixed; z-index: 110; inset: 0; display: grid; place-items: center;
      padding: 22px; background: rgba(17,30,24,.56);
    }
    .modal {
      width: min(760px, 100%); max-height: 88vh; overflow: auto; padding: 26px;
      border-radius: 16px; background: var(--paper); box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }
    .guide-progress { display: flex; gap: 6px; margin: 18px 0; }
    .guide-progress span { height: 5px; flex: 1; border-radius: 999px; background: #ddd5c7; }
    .guide-progress span.active { background: var(--red); }
    .guide-visual {
      min-height: 210px; padding: 20px; margin: 16px 0; border-radius: 12px;
      background: linear-gradient(135deg, #e1eadf, #f3e2da); border: 1px solid var(--line);
      display: grid; place-items: center; text-align: center;
    }
    .scenario-toggle {
      display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden;
    }
    .scenario-toggle button {
      border: 0; background: var(--paper); padding: 7px 9px; font-size: 11px;
    }
    .scenario-toggle button.active { background: var(--forest); color: white; }
    @media (max-width: 1160px) {
      .boundary-grid, .review-grid { grid-template-columns: 230px minmax(0,1fr); }
      .boundary-grid > :last-child, .review-grid > :last-child { grid-column: 1 / -1; }
      .variant-c .cockpit-grid { grid-template-columns: 210px minmax(0,1fr); }
      .variant-c .evidence-dock { position: static; grid-column: 1 / -1; grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 820px) {
      .topbar { flex-wrap: wrap; }
      .context-line { order: 5; width: 100%; }
      .variant-a .workspace, .variant-b .field-shell, .variant-c .cockpit-grid,
      .campus-confirm, .generate-grid { grid-template-columns: 1fr; }
      .variant-a .context-panel, .variant-c .mission, .variant-c .evidence-dock { position: static; }
      .variant-b .field-rail { display: none; }
      .boundary-grid, .review-grid { grid-template-columns: 1fr; }
      .boundary-grid > :last-child, .review-grid > :last-child { grid-column: auto; }
      .table-head { display: none; }
      .project-row { grid-template-columns: 1fr; }
      .debug { display: none; }
      .switch-label { min-width: 170px; }
    }
  </style>
</head>
<body>
  <div class="prototype-banner">
    一次性原型 · 只验证整体产品路线与信息架构 · 所有操作仅修改内存状态
  </div>
  <div id="root"></div>
  <div id="debug" class="debug" hidden></div>
  <div id="toast"></div>

  <script>
    const variants = {
      A: "路线优先 · 明确阶段 + 当前任务",
      B: "地图优先 · 现场笔记本",
      C: "证据驾驶舱 · 任务/工作/证据三栏"
    };
    const stages = [
      { id: "campus", label: "确认校区", short: "校区目标" },
      { id: "library", label: "选择项目", short: "校区项目库" },
      { id: "boundary", label: "确认边界", short: "校区边界" },
      { id: "review", label: "审核五层", short: "校园基础" },
      { id: "generate", label: "生成与导出", short: "Minecraft 26.1.2" }
    ];
    const guideSteps = [
      {
        title: "先确认校区目标",
        body: "项目永远属于一个已确认的校区。先确认校区，再进入该校区自己的项目库。",
        visual: "① 校区搜索与确认 → ② 只显示该校区的项目"
      },
      {
        title: "每个项目独立、可恢复",
        body: "同一校区可以有多个项目。保存状态、恢复副本、进度和下一个未完成任务始终可见。",
        visual: "项目标识 · 原子保存 · 50 步历史 · 项目恢复状态"
      },
      {
        title: "自动证据先于人工调整",
        body: "边界来自受控 OSM/Overture 候选。只能选择有效候选后编辑顶点，不从空白画布开始。",
        visual: "候选列表 | 地图与顶点 | 来源、覆盖和许可"
      },
      {
        title: "审核五类证据，不发明缺失几何",
        body: "建筑、道路与步行、水域、植被、体育设施独立完成；缺失内容记录为“已知地物缺口”。",
        visual: "待办队列 | 空间地图 | 证据面板"
      },
      {
        title: "一个兼容配置贯穿预览和导出",
        body: "预览、方块选择、生成和 Sponge .schem 导出统一使用 Minecraft Java Edition 26.1.2。",
        visual: "已审核校园模型 → 预览 → .schem + 校园基础清单 → Axiom"
      }
    ];
    const layerSeed = {
      building: { label: "建筑", remaining: 2, gap: false, acknowledged: true, done: false },
      circulation: { label: "道路与步行", remaining: 1, gap: false, acknowledged: true, done: false },
      water: { label: "水域", remaining: 1, gap: true, acknowledged: false, done: false },
      vegetation: { label: "植被", remaining: 1, gap: true, acknowledged: false, done: false },
      sports: { label: "体育设施", remaining: 1, gap: false, acknowledged: true, done: false }
    };
    function freshLayers() {
      return Object.fromEntries(Object.entries(layerSeed).map(([key, value]) => [key, { ...value }]));
    }
    const params = new URLSearchParams(location.search);
    const state = {
      variant: variants[params.get("variant")] ? params.get("variant") : "A",
      stage: "campus",
      scenario: "normal",
      campus: "华东师范大学普陀校区",
      campusConfirmed: false,
      project: null,
      save: "已保存 · 09:42",
      guideOpen: true,
      guideStep: 0,
      selectedBoundary: "OSM 关系对象 384912",
      boundaryEditing: false,
      boundaryValid: true,
      activeLayer: "building",
      layers: freshLayers(),
      generated: false,
      exported: false,
      axiomChecked: false,
      debugOpen: false,
      lastAction: "等待首次引导"
    };
    const root = document.getElementById("root");
    const debug = document.getElementById("debug");
    const toastHost = document.getElementById("toast");
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;"
    })[char]);

    function stageIndex(id = state.stage) {
      return stages.findIndex(item => item.id === id);
    }
    function layerEntries() {
      return Object.entries(state.layers);
    }
    function reviewDoneCount() {
      return layerEntries().filter(([, layer]) => layer.done).length;
    }
    function allReviewDone() {
      return reviewDoneCount() === layerEntries().length;
    }
    function projectProgress() {
      if (state.exported) return 100;
      if (state.stage === "generate") return 82 + (state.generated ? 8 : 0);
      if (state.stage === "review") return 38 + reviewDoneCount() * 8;
      if (state.stage === "boundary") return 24;
      if (state.stage === "library") return 12;
      return 4;
    }
    function updateAction(message, rerender = true) {
      state.lastAction = message;

    function evidenceDock() {
      return `<aside class="evidence-dock">
        <div class="card card-pad"><div class="eyebrow">证据基础</div><h3>${state.stage === "campus" ? "高德地点结果" : state.stage === "library" ? "应用管理的项目库" : "数据集包 CN-2026-07-A"}</h3><div class="tiny muted">凭据不进入项目、日志或证据包。</div></div>
        <div class="card card-pad"><div class="eyebrow">数据耐久性</div><h3>${escapeHtml(state.save)}</h3><div class="tiny muted">原子项目保存点 · 50 步历史</div></div>
        <div class="card card-pad"><div class="eyebrow">当前门槛</div><h3>${state.stage === "review" ? `${reviewDoneCount()}/5 层` : stages[stageIndex()].label}</h3><div class="tiny muted">${state.scenario === "unavailable" && state.stage === "boundary" ? "诚实阻塞 · 不允许继续" : "发布阻断问题不允许豁免"}</div></div>
      </aside>`;
    }
    function variantA() {
      return `<div class="app variant-a">${topbar()}<div class="route-shell">${routeSteps(true)}
        <div class="workspace"><main class="main-stage">${currentStageContent()}</main><aside class="context-panel">${contextCard()}</aside></div>
      </div></div>`;
    }
    function variantB() {
      return `<div class="app variant-b">${topbar()}<div class="field-shell">
        <aside class="field-rail"><div class="eyebrow">复刻路线</div><h3 style="color:white">现场笔记本</h3>${routeSteps(false)}
          <div class="soft-panel" style="margin-top:18px;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15);color:#e5eee9">
            <div class="tiny">当前项目</div><strong>${escapeHtml(state.project || "未选择")}</strong><div class="tiny" style="margin-top:5px">${projectProgress()}% · ${escapeHtml(state.save)}</div>
          </div>
        </aside>
        <main class="field-main"><div class="stage-frame">
          <div class="floating-context"><span class="pill">${escapeHtml(state.campus)}</span><span class="pill blue">Minecraft 26.1.2</span><span class="pill ${state.scenario === "unavailable" ? "error" : ""}">${state.scenario === "unavailable" ? "负面路线" : "正常路线"}</span></div>
          ${currentStageContent()}
        </div></main>
      </div></div>`;
    }
    function variantC() {
      return `<div class="app variant-c">${topbar()}<div class="cockpit">
        <div class="cockpit-grid">${missionRail()}<main>${currentStageContent()}</main>${evidenceDock()}</div>
      </div></div>`;
    }
    function switcher() {
      return `<div class="switcher">
        <button data-action="prev-variant" aria-label="上一个方案">←</button>
        <div class="switch-label"><strong>${state.variant}</strong> — ${variants[state.variant]}</div>
        <button class="state-toggle" data-action="toggle-debug">${state.debugOpen ? "隐藏原型状态" : "查看原型状态"}</button>
        <button data-action="next-variant" aria-label="下一个方案">→</button>
      </div>`;
    }
    function guideModal() {
      if (!state.guideOpen) return "";
      const step = guideSteps[state.guideStep];
      return `<div class="modal-backdrop"><div class="modal">
        <div class="row between"><div><div class="eyebrow">首次使用引导 · ${state.guideStep + 1}/5</div><h2>${step.title}</h2></div><button class="btn ghost" data-action="skip-guide">跳过</button></div>
        <div class="guide-progress">${guideSteps.map((_, index) => `<span class="${index <= state.guideStep ? "active" : ""}"></span>`).join("")}</div>
        <p class="muted">${step.body}</p>
        <div class="guide-visual"><div><div style="font-size:40px;margin-bottom:10px">${["◎","▤","⌁","☷","▦"][state.guideStep]}</div><strong>${step.visual}</strong><div class="tiny muted" style="margin-top:8px">引导不会改变项目状态</div></div></div>
        <div class="row between">
          <button class="btn" data-action="guide-prev" ${state.guideStep === 0 ? "disabled" : ""}>上一步</button>
          <button class="btn primary" data-action="${state.guideStep === guideSteps.length - 1 ? "finish-guide" : "guide-next"}">${state.guideStep === guideSteps.length - 1 ? "开始使用" : "下一步"}</button>
        </div>
      </div></div>`;
    }
    function settingsModal() {
      if (state.modal !== "settings") return "";
      return `<div class="modal-backdrop"><div class="modal">
        <div class="row between"><div><div class="eyebrow">设置</div><h2>设置、恢复与快捷键</h2></div><button class="btn ghost" data-action="close-modal">关闭</button></div>
        <div class="generate-grid">
          <div>
            <div class="soft-panel"><h3>常规与引导</h3><p class="tiny muted">语言：简体中文 · 首次引导：已完成</p><button class="btn compact" data-action="open-guide">重新打开引导</button></div>
            <div class="soft-panel" style="margin-top:10px"><h3>保存与恢复</h3><p class="tiny muted">项目保存点以语义操作为原子单位。项目恢复状态必须由用户选择，不会自动覆盖已确认项目。</p></div>
          </div>
          <div class="soft-panel"><h3>快捷键可用性</h3>
            ${[
              ["Ctrl+S", "立即保存", "可用"],
              ["Ctrl+Enter", "确认当前任务", state.stage === "boundary" && state.scenario === "unavailable" ? "不可用：没有可信边界" : "可用"],
              ["Delete", "删除所选边界顶点", state.stage === "boundary" && state.boundaryEditing ? "可用" : "不可用：未处于边界调整模式"],
              ["F1", "重新打开引导", "可用"]
            ].map(([key, label, availability]) => `<div class="list-item"><div class="row between"><strong class="mono">${key}</strong><span class="tiny">${label}</span></div><div class="tiny muted">${availability}</div></div>`).join("")}
          </div>
        </div>
      </div></div>`;
    }
    function simpleModal() {
      if (!state.modal || state.modal === "settings") return "";
      const content = {
        "search": ["搜索其他高校", "模拟搜索结果会替换当前校区目标，但不会读取真实高德服务。"],
        "import": ["导入便携项目", "导入会验证临时副本、创建新项目标识，并在跨校园时先保存当前项目。"],
        "new": ["新建校园复刻项目", "项目名称只在当前校区内唯一；新项目不会继承其他项目的审核状态。"],
        "recovery": ["选择项目恢复状态", "恢复副本比已确认版本更新。选择恢复或保留已确认版本；不会自动合并。"]
      }[state.modal] || ["原型提示", "此处只展示整体流程，不执行真实操作。"];
      return `<div class="modal-backdrop"><div class="modal">
        <div class="eyebrow">原型提示</div><h2>${content[0]}</h2><p class="muted">${content[1]}</p>
        ${state.modal === "search" ? `<div class="list"><button class="list-item active" data-action="choose-campus"><strong>上海交通大学闵行校区</strong><div class="tiny muted">闵行区 · 高德地点候选</div></button><div class="list-item"><strong>上海交通大学徐汇校区</strong><div class="tiny muted">徐汇区 · 另一个校区目标</div></div></div>` : ""}
        ${state.modal === "new" ? `<label class="small"><strong>项目名称</strong><input value="校园复刻方案 2" style="width:100%;padding:10px;margin-top:7px;border:1px solid var(--line);border-radius:8px"></label>` : ""}
        <div class="button-row" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-modal">确认</button></div>
      </div></div>`;
    }
    function render() {
      root.innerHTML = state.variant === "A" ? variantA() : state.variant === "B" ? variantB() : variantC();
      root.insertAdjacentHTML("beforeend", switcher());
      root.insertAdjacentHTML("beforeend", guideModal());
      root.insertAdjacentHTML("beforeend", settingsModal());
      root.insertAdjacentHTML("beforeend", simpleModal());
      renderDebug();
    }
    function setVariant(next) {
      state.variant = next;
      const url = new URL(location.href);
      url.searchParams.set("variant", next);
      history.replaceState({}, "", url);
      state.lastAction = `切换到方案 ${next}：${variants[next]}`;
      render();
    }
    function cycleVariant(direction) {
      const keys = Object.keys(variants);
      const index = keys.indexOf(state.variant);
      setVariant(keys[(index + direction + keys.length) % keys.length]);
    }
    function resetForScenario(scenario) {
      state.scenario = scenario;
      state.stage = scenario === "unavailable" ? "boundary" : "campus";
      state.campus = scenario === "unavailable" ? "纽约大学上海前滩校园" : "华东师范大学普陀校区";
      state.campusConfirmed = scenario === "unavailable";
      state.project = scenario === "unavailable" ? "前滩校园边界验证" : null;
      state.selectedBoundary = scenario === "unavailable" ? null : "OSM 关系对象 384912";
      state.boundaryEditing = false;
      state.layers = freshLayers();
      state.activeLayer = "building";
      state.generated = false;
      state.exported = false;
      state.axiomChecked = false;
      state.guideOpen = false;
      state.lastAction = scenario === "unavailable" ? "载入边界不可用的负面路线" : "重置为正常路线";
      render();
    }
    document.addEventListener("click", event => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      if (action === "prev-variant") return cycleVariant(-1);
      if (action === "next-variant") return cycleVariant(1);
      if (action === "toggle-debug") {
        state.debugOpen = !state.debugOpen;
        state.lastAction = state.debugOpen ? "已打开原型专用状态面板" : "已隐藏原型专用状态面板";
        return render();
      }
      if (action === "scenario") return resetForScenario(target.dataset.value);
      if (action === "open-guide") { state.modal = null; state.guideOpen = true; state.guideStep = 0; return render(); }
      if (action === "skip-guide" || action === "finish-guide") { state.guideOpen = false; return updateAction(action === "skip-guide" ? "已跳过引导，可随时用 F1 或 ? 重新打开" : "已完成首次引导"); }
      if (action === "guide-next") { state.guideStep++; return render(); }
      if (action === "guide-prev") { state.guideStep--; return render(); }
      if (action === "settings") { state.modal = "settings"; return render(); }
      if (action === "close-modal") { state.modal = null; return render(); }
      if (action === "search-campus") { state.modal = "search"; return render(); }
      if (action === "import-project") { state.modal = "import"; return render(); }
      if (action === "new-project") { state.modal = "new"; return render(); }
      if (action === "choose-campus") {
        state.campus = "上海交通大学闵行校区"; state.modal = null;
        return updateAction("已选择新的校区目标候选，仍需明确确认");
      }
      if (action === "confirm-modal") {
        const kind = state.modal;
        state.modal = null;
        if (kind === "new") { state.project = "校园复刻方案 2"; state.stage = "boundary"; }
        return updateAction(kind === "new" ? "已创建独立的版本 2 数据结构项目并进入边界任务" : "原型已模拟事务式操作");
      }
      if (action === "confirm-campus") {
        state.campusConfirmed = true; state.stage = "library"; state.save = "已保存 · 刚刚";
        return updateAction("校区目标已确认，只显示该校区的项目");
      }
      if (action === "open-project") {
        if (target.dataset.name === "材质实验") { state.modal = "recovery"; return render(); }
        state.project = target.dataset.name; state.stage = target.dataset.name.includes("对照") ? "generate" : "boundary";
        return updateAction(`已打开 ${target.dataset.name}，进入最早未完成任务`);
      }
      if (action === "select-boundary") { state.selectedBoundary = target.dataset.value; return updateAction(`已选择 ${target.dataset.value}`); }
      if (action === "invalid-boundary") return updateAction("无效候选只能诊断，不能编辑或确认");
      if (action === "toggle-boundary-edit") { state.boundaryEditing = !state.boundaryEditing; return updateAction(state.boundaryEditing ? "已进入选择优先的边界调整模式" : "已结束边界调整"); }
      if (action === "undo-boundary") return updateAction("已撤销一个完整边界编辑操作");
      if (action === "restore-boundary") return updateAction("已恢复候选原始形状");
      if (action === "confirm-boundary") {
        state.boundaryEditing = false; state.stage = "review"; state.save = "已保存 · 刚刚";
        return updateAction("边界和边界发现快照已保存，五类采集使用同一数据集包");
      }
      if (action === "retry-boundary") return updateAction("已按同一版本契约重试；原型保持边界不可用结果");
      if (action === "back-campus") {
        state.stage = "campus"; state.campusConfirmed = false; state.project = null;
        return updateAction("已返回校区目标确认，未创建虚假边界");
      }
      if (action === "select-layer") { state.activeLayer = target.dataset.layer; return updateAction(`切换到 ${state.layers[state.activeLayer].label}`); }
      if (action === "inspect-candidate") return updateAction("已在地图和证据面板中同步选中候选");
      if (action === "review-candidate") {
        const layer = state.layers[state.activeLayer];
        layer.remaining = Math.max(0, layer.remaining - 1);
        return updateAction(`已追加 ${layer.label}审核日志决定；来源观测记录未被修改`);
      }
      if (action === "ack-gap") {
        state.layers[state.activeLayer].acknowledged = true;
        return updateAction("已知地物缺口已承认但仍未解决，不创建猜测几何");
      }
      if (action === "complete-layer") {
        state.layers[state.activeLayer].done = true;
        const next = layerEntries().find(([, layer]) => !layer.done);
        if (next) state.activeLayer = next[0];
        return updateAction("已显式完成一层；批处理从不隐式完成层");
      }
      if (action === "near-complete") {
        for (const [, layer] of layerEntries()) { layer.remaining = 0; if (layer.gap) layer.acknowledged = true; }
        for (const [key, layer] of layerEntries()) layer.done = key !== "sports";
        state.activeLayer = "sports";
        return updateAction("已载入临近完成状态：体育设施等待显式完成");
      }
      if (action === "go-generate") { state.stage = "generate"; return updateAction("五层均已完成，进入当前修订生成"); }
      if (action === "generate") { state.generated = true; state.exported = false; state.axiomChecked = false; return updateAction("已生成确定性 Minecraft 26.1.2 当前修订"); }
      if (action === "inspect-blocks") return updateAction("方块检查：所有方块标识均属于 Minecraft Java 26.1.2 兼容配置");
      if (action === "export") { state.exported = true; state.save = "已保存 · 刚刚"; return updateAction("已事务式导出 .schem 与校园基础清单"); }
      if (action === "axiom") { state.axiomChecked = true; return updateAction("已模拟 Axiom 导入验收；真实结果必须进入发布证据包"); }
      if (action === "back-review") { state.stage = "review"; return updateAction("返回已完成审核不会自动重新打开任务"); }
      if (action === "jump-stage") {
        const targetIndex = stageIndex(target.dataset.stage);
        if (targetIndex <= stageIndex()) { state.stage = target.dataset.stage; return updateAction("正在查看已到达的任务；查看本身不改变完成状态"); }
      }
    });
    document.addEventListener("keydown", event => {
      const editing = event.target.matches("input, textarea, select, [contenteditable=true]");
      if (!editing && event.key === "ArrowLeft") { event.preventDefault(); cycleVariant(-1); }
      if (!editing && event.key === "ArrowRight") { event.preventDefault(); cycleVariant(1); }
      if (event.key === "F1") { event.preventDefault(); state.guideOpen = true; state.guideStep = 0; render(); }
      if (event.key === "Escape") {
        if (state.guideOpen) state.guideOpen = false;
        else if (state.modal) state.modal = null;
        else if (state.boundaryEditing) state.boundaryEditing = false;
        else return;
        event.preventDefault(); render();
      }
    });
    render();
  </script>
</body>
</html>
