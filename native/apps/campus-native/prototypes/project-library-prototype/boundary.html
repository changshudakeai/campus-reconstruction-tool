<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Campus Boundary Review</title>
  <!-- Three boundary-review variants, switchable via ?variant=, inside the existing campus/project shell. -->
  <style>
    :root{--ink:#17251f;--muted:#66736c;--forest:#244a3a;--forest2:#356550;--cream:#f4f0e5;--paper:#fffdf7;--warm:#eee6d6;--line:#c8bcaa;--red:#a54836;--red2:#f2dcd3;--green:#dfe9df;--gold:#efe4bd;--blue:#315f78;--shadow:0 18px 48px rgba(26,45,36,.14)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink)}body,button{font-family:"Microsoft YaHei UI","Segoe UI",sans-serif}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:focus-visible,[tabindex]:focus-visible{outline:3px solid rgba(165,72,54,.32);outline-offset:2px}
    .proto{height:28px;display:flex;align-items:center;justify-content:center;background:#15221c;color:#fff7e8;font-size:11px;letter-spacing:.08em}.topbar{height:66px;display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--warm);border-bottom:2px solid var(--forest)}.brand{font-size:20px;font-weight:850}.divider{height:30px;width:1px;background:var(--line)}.crumb{font-size:13px;color:var(--muted)}.spacer{flex:1}.save{font-size:12px;font-weight:750;color:var(--forest2)}
    button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--paper);color:var(--ink)}button:hover:not(:disabled){border-color:var(--forest2)}.primary{background:var(--forest);border-color:var(--forest);color:white;font-weight:750}.primary:hover:not(:disabled){background:var(--forest2)}.danger{color:var(--red);border-color:#d5aba0;background:#fff8f5}.quiet{background:transparent}.small{padding:7px 9px;font-size:12px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}h1,h2,h3,p{margin-top:0}h1{font-size:27px;margin-bottom:7px}h2{font-size:20px;margin-bottom:7px}h3{font-size:15px;margin-bottom:5px}.muted{color:var(--muted)}.tiny{font-size:11px}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;font-size:11px;background:var(--green);color:#28503c}.pill.warn{background:var(--gold);color:#705b1f}.pill.bad{background:var(--red2);color:#873727}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.stack{display:grid;gap:10px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
    .map{position:relative;min-height:520px;overflow:hidden;background:#e6e3d7}.map svg{display:block;width:100%;height:100%;min-height:520px;touch-action:none}.map-grid{stroke:#c9c7bb;stroke-width:1}.road{fill:none;stroke:#fffdf6;stroke-width:15;stroke-linecap:round}.road-edge{fill:none;stroke:#b8b3a8;stroke-width:18;stroke-linecap:round}.water{fill:#bcd4d8;stroke:#6d9daa;stroke-width:1}.building{fill:#d7cab4;stroke:#9b8b71;stroke-width:1}.candidate{fill:rgba(36,74,58,.17);stroke:var(--forest);stroke-width:3}.candidate.alt{fill:rgba(165,72,54,.08);stroke:var(--red);stroke-dasharray:9 6}.edge-hit{fill:none;stroke:transparent;stroke-width:18;cursor:crosshair}.edge-selected{stroke:#d38b37!important;stroke-width:7!important}.vertex{fill:var(--paper);stroke:var(--forest);stroke-width:3;cursor:grab}.vertex.selected{fill:#e0a34a;stroke:#6d451b;stroke-width:4}.vertex:active{cursor:grabbing}.map-label{font-size:11px;fill:#42534a}.map-help{position:absolute;left:14px;bottom:14px;max-width:360px;padding:9px 11px;border-radius:8px;background:rgba(255,253,247,.94);border:1px solid var(--line);font-size:11px;color:var(--muted)}.map-badge{position:absolute;right:14px;top:14px;padding:7px 10px;border-radius:99px;background:rgba(23,37,31,.9);color:white;font-size:11px}
    .candidate-card{padding:13px;border:1px solid #d8cebd;border-radius:9px;background:#fcf9f1;cursor:pointer}.candidate-card.selected{border:2px solid var(--forest);padding:12px;background:#f0f4ec}.candidate-card.invalid{border-style:dashed}.score{font-size:22px;font-weight:850;color:var(--forest)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fact{padding:9px;background:#f3ede2;border-radius:7px;font-size:11px}.fact strong{display:block;font-size:13px;margin-bottom:2px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;padding:10px;border:1px solid var(--line);border-radius:10px;background:#f8f3e9}.toolbar strong{align-self:center;margin-right:4px}.notice{padding:11px;border-left:4px solid var(--blue);background:#edf4f5;font-size:12px}.notice.warn{border-color:#c38627;background:#fff7e3}.notice.bad{border-color:var(--red);background:#fff0ec}
    .a-shell{display:grid;grid-template-columns:280px minmax(460px,1fr) 310px;height:calc(100vh - 94px);min-height:650px}.a-left,.a-right{overflow:auto;padding:18px;background:#f1eadc}.a-left{border-right:1px solid var(--line)}.a-right{border-left:1px solid var(--line)}.a-center{display:grid;grid-template-rows:auto 1fr;min-width:0}.a-maphead{padding:14px 17px;border-bottom:1px solid var(--line);background:var(--paper)}.a-center .map,.a-center .map svg{min-height:100%;height:100%}.a-bottom{position:fixed;z-index:20;left:280px;right:310px;bottom:74px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,253,247,.98);border:1px solid var(--line);border-radius:0 0 12px 12px;box-shadow:0 -10px 28px rgba(26,45,36,.14)}.a-bottom .next-copy{font-size:12px;color:var(--muted)}.a-bottom .primary{margin-left:auto;font-size:14px;padding:11px 16px}
    .b-shell{max-width:1260px;margin:0 auto;padding:20px 26px 100px}.steps{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 0 18px}.step{padding:12px;border:1px solid var(--line);background:#e8e0d2;font-size:12px;color:var(--muted)}.step:first-child{border-radius:9px 0 0 9px}.step:last-child{border-radius:0 9px 9px 0}.step.active{background:var(--forest);color:white;border-color:var(--forest)}.b-content{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.b-map.card{overflow:hidden}.b-maphead{padding:14px 16px;border-bottom:1px solid var(--line)}.b-side{padding:16px}.b-candidates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.b-bottom{position:sticky;bottom:72px;margin-top:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;background:rgba(255,253,247,.96);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
    .c-shell{height:calc(100vh - 94px);min-height:650px;position:relative;overflow:hidden}.c-shell .map,.c-shell .map svg{height:100%;min-height:100%}.c-context{position:absolute;z-index:5;left:18px;top:18px;width:280px;padding:15px;background:rgba(255,253,247,.95);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.c-tools{position:absolute;z-index:6;right:18px;top:18px;display:grid;gap:8px;padding:9px;background:rgba(23,37,31,.94);border-radius:11px}.c-tools button{background:#2c4439;color:white;border-color:#557064}.c-sheet{position:absolute;z-index:5;left:50%;bottom:96px;transform:translateX(-50%);width:min(880px,calc(100% - 36px));padding:15px 17px;background:rgba(255,253,247,.97);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.c-sheet-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.candidate-tabs{display:flex;gap:6px}.candidate-tabs button.active{background:var(--forest);color:white;border-color:var(--forest)}
    .switcher{position:fixed;z-index:30;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:99px;background:#101b16;color:white;box-shadow:0 12px 32px rgba(0,0,0,.32)}.switcher button{width:34px;height:34px;padding:0;border-radius:50%;border:0;background:#304a3f;color:white}.switcher span{min-width:215px;text-align:center;font-size:12px}.debug{position:fixed;z-index:25;left:12px;bottom:12px;width:300px;padding:9px 11px;background:rgba(255,253,247,.95);border:1px dashed #8f806a;font:10px/1.45 Consolas,monospace;color:#4f5e56}.toast{position:fixed;z-index:50;right:18px;top:44px;max-width:420px;padding:12px 15px;background:#17251f;color:white;border-radius:9px;box-shadow:var(--shadow)}
    @media(max-width:1000px){.a-shell{grid-template-columns:230px 1fr}.a-right{display:none}.a-bottom{left:230px;right:0}.b-content{grid-template-columns:1fr}.b-candidates{grid-template-columns:1fr}.c-context{width:240px}.debug{display:none}}@media(max-width:720px){.a-shell{display:block;height:auto}.a-left{border:0}.a-center .map{min-height:520px}.a-bottom{left:0;right:0}.a-bottom .next-copy{display:none}.steps{grid-template-columns:1fr}.step{border-radius:0!important}.c-sheet-grid{grid-template-columns:1fr}.c-context{left:10px;top:10px}.c-tools{right:10px;top:10px}.topbar .save,.topbar .quiet{display:none}}
  </style>
</head>
<body>
  <div class="proto">THROWAWAY PROTOTYPE · 边界操作只修改内存 · 不连接高德或受控服务</div>
  <div class="topbar"><div class="brand">MC 校园复刻</div><div class="divider"></div><div class="crumb">华东师范大学普陀校区 / 普陀校区主复刻 / 确认 Campus Boundary</div><div class="spacer"></div><span class="save">● 已保存 · 16:42</span><button class="quiet">设置</button></div>
  <div id="root"></div><div id="debug" class="debug"></div><div id="toast"></div>
  <script>
    const variants={A:"三栏证据台",B:"引导式四步",C:"全屏地图与底部面板"};
    const candidates=[
      {id:"osm-rel-1842",name:"OSM 教育用地关系",source:"OpenStreetMap · relation 1842",rank:1,score:92,valid:true,reason:"校区名称完全匹配；包含高德锚点；关系完整",coverage:"完整 · 12/12 分块",points:[[160,115],[360,78],[610,126],[675,280],[596,430],[346,470],[125,365],[104,210]]},
      {id:"overture-land-77",name:"Overture 大学用地",source:"Overture land_use · 2026-06-17.0",rank:2,score:78,valid:true,reason:"类别匹配；包含锚点；东侧边界与 OSM 存在差异",coverage:"完整 · 8/8 分块",points:[[145,128],[372,95],[625,140],[650,300],[560,447],[330,452],[115,350],[118,205]]},
      {id:"osm-rel-bad",name:"不完整关系候选",source:"OpenStreetMap · relation 9103",rank:3,score:34,valid:false,reason:"缺少 2 个 outer member，无法形成闭合面",coverage:"部分 · 10/12 分块",points:[[220,155],[410,135],[575,180],[520,330],[300,360]]}
    ];
    const initial=candidates.map(c=>c.points.map(p=>[...p]));
    const state={variant:new URLSearchParams(location.search).get("variant")||"A",candidate:0,edit:false,selectedVertex:null,selectedEdge:null,points:initial[0].map(p=>[...p]),history:[],confirmed:false,service:"ready",last:"等待选择自动边界候选"};
    if(!variants[state.variant])state.variant="A";
    const root=document.querySelector("#root"),debug=document.querySelector("#debug"),toast=document.querySelector("#toast");
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const active=()=>candidates[state.candidate];
    function setLast(text){state.last=text;toast.innerHTML=`<div class="toast">${esc(text)}</div>`;clearTimeout(setLast.t);setLast.t=setTimeout(()=>toast.innerHTML="",2300);renderDebug()}
    function snapshot(){state.history.push(state.points.map(p=>[...p]));if(state.history.length>20)state.history.shift()}
    function selectCandidate(i){state.candidate=i;state.points=initial[i].map(p=>[...p]);state.edit=false;state.selectedVertex=null;state.selectedEdge=null;state.confirmed=false;setLast(`已选择候选 ${i+1}：${candidates[i].name}`);render()}
    function candidateCards(compact=false){return candidates.map((c,i)=>`<div class="candidate-card ${i===state.candidate?"selected":""} ${!c.valid?"invalid":""}" data-action="candidate" data-index="${i}" tabindex="0"><div class="row"><span class="pill ${c.valid?i?"warn":"":"bad"}">${c.valid?`排名 ${c.rank}`:"无效"}</span><span class="spacer"></span><span class="score">${c.score}</span></div><h3>${c.name}</h3>${compact?"":`<p class="tiny muted">${c.source}</p><p class="tiny">${c.reason}</p><span class="tiny muted">${c.coverage}</span>`}</div>`).join("")}
    function mapSvg(){const pts=state.points.map(p=>p.join(",")).join(" ");const edges=state.edit?state.points.map((p,i)=>{const q=state.points[(i+1)%state.points.length];return `<line class="edge-hit ${state.selectedEdge===i?"edge-selected":""}" data-action="edge" data-index="${i}" x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"/>`}).join(""):"";const vertices=state.edit?state.points.map((p,i)=>`<circle class="vertex ${state.selectedVertex===i?"selected":""}" data-action="vertex" data-index="${i}" cx="${p[0]}" cy="${p[1]}" r="8" tabindex="0"/>`).join(""):"";return `<div class="map"><svg viewBox="0 0 760 540" aria-label="Campus Boundary 编辑地图"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" class="map-grid"/></pattern></defs><rect width="760" height="540" fill="url(#g)"/><path class="water" d="M0 430 Q180 360 310 430 T760 400 L760 540 L0 540Z"/><path class="road-edge" d="M-20 300 C180 250 350 310 780 210"/><path class="road" d="M-20 300 C180 250 350 310 780 210"/><g>${[[210,190,52,30],[330,170,75,42],[480,205,65,38],[250,315,80,45],[430,335,95,52]].map(b=>`<rect class="building" x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="3"/>`).join("")}</g><text class="map-label" x="330" y="265">华东师范大学普陀校区</text><polygon class="candidate ${state.candidate===1?"alt":""}" points="${pts}"/>${edges}${vertices}<circle cx="385" cy="255" r="7" fill="#a54836"/><text class="map-label" x="398" y="250">高德 Campus Target 锚点</text></svg><div class="map-badge">${state.edit?"调整模式 · 点与边可操作":"审核模式 · 地图不会误改"}</div><div class="map-help">${state.edit?(state.selectedVertex!==null?`已选择顶点 ${state.selectedVertex+1}：拖动或删除。`:(state.selectedEdge!==null?`已选择边 ${state.selectedEdge+1}：可在两点之间插入顶点。`:"先选择一个顶点或一条边，再执行调整。")):"候选边界只供查看；点击“调整边界”后才显示可编辑顶点。"}</div></div>`}
    function editToolbar(){return `<div class="toolbar"><strong>${state.edit?"边界调整":"候选审核"}</strong><button class="small ${state.edit?"":"primary"}" data-action="edit" ${!active().valid?"disabled":""}>${state.edit?"退出调整":"调整边界"}</button><button class="small" data-action="insert" ${!state.edit||state.selectedEdge===null?"disabled":""}>在所选边插入顶点</button><button class="small danger" data-action="delete" ${!state.edit||state.selectedVertex===null||state.points.length<=3?"disabled":""}>删除所选顶点</button><button class="small" data-action="undo" ${!state.history.length?"disabled":""}>撤销</button><button class="small" data-action="reset">恢复候选原状</button></div>`}
    function evidence(){const c=active();return `<div class="stack"><div><div class="eyebrow">候选依据</div><h2>${c.name}</h2><p class="muted tiny">${c.source}</p></div><div class="facts"><div class="fact"><strong>${c.score}/100</strong>排序评分</div><div class="fact"><strong>${state.points.length}</strong>当前顶点</div><div class="fact"><strong>WGS-84</strong>审核坐标</div><div class="fact"><strong>${c.valid?"有效":"无效"}</strong>几何状态</div></div><div class="notice ${c.valid?"":"bad"}">${c.reason}</div><div class="tiny muted">Dataset Bundle<br><strong>osm-2026-07-01 + overture-2026-06-17.0</strong></div><div class="tiny muted">Coverage<br><strong>${c.coverage}</strong></div><button data-action="advanced">查看来源与排名详情</button></div>`}
    function servicePanel(){if(state.service==="ready")return "";if(state.service==="unavailable")return `<div class="notice bad"><strong>没有可用边界候选</strong><br>受控服务暂时不可用。项目保持在“确认 Campus Boundary”，不会进入空白绘制。<div class="row" style="margin-top:9px"><button class="small" data-action="retry">重试服务</button><button class="small" data-action="back">返回校区确认</button></div></div>`;return `<div class="notice warn"><strong>所有候选几何均无效</strong><br>缺少 relation member，不能作为可编辑起点。<div class="row" style="margin-top:9px"><button class="small" data-action="retry">重新获取候选</button><button class="small" data-action="back">返回校区确认</button></div></div>`}
    function confirmBlock(showPrimary=true){return `<div class="stack"><div class="notice ${state.confirmed?"":"warn"}">${state.confirmed?"边界已确认并保存；下一步将使用同一 Dataset Bundle 获取五类地物。":"确认后才会启动五类地物获取。当前调整可继续撤销。"}</div>${showPrimary?`<button class="primary" data-action="confirm" ${!active().valid||state.service!=="ready"?"disabled":""}>${state.confirmed?"✓ 已确认 Campus Boundary":"确认边界并继续"}</button>`:""}<button data-action="simulate-unavailable">模拟服务不可用</button><button data-action="simulate-invalid">模拟全部候选无效</button></div>`}
    function variantA(){return `<main class="a-shell"><aside class="a-left"><div class="eyebrow">自动候选 · 3</div><h2>选择边界来源</h2><p class="muted tiny">先比较候选，再进入调整。无效候选仅保留诊断。</p><div class="stack">${candidateCards()}</div></aside><section class="a-center"><div class="a-maphead"><div class="row"><div><div class="eyebrow">Campus Boundary</div><strong>${active().name}</strong></div><div class="spacer"></div>${editToolbar()}</div>${servicePanel()}</div>${mapSvg()}<div class="a-bottom"><div class="next-copy"><strong>下一步：获取五类地物</strong><br>确认后保存边界，并沿用当前 Dataset Bundle。</div><button data-action="back">返回校区确认</button><button class="primary" data-action="confirm" ${!active().valid||state.service!=="ready"?"disabled":""}>${state.confirmed?"✓ 边界已保存":"确认边界并进入下一步"}</button></div></section><aside class="a-right">${evidence()}<hr style="border:0;border-top:1px solid var(--line);margin:17px 0">${confirmBlock(false)}</aside></main>`}
    function variantB(){return `<main class="b-shell"><div class="eyebrow">引导式确认</div><h1>确认华东师范大学普陀校区边界</h1><div class="steps"><div class="step ${!state.edit&&!state.confirmed?"active":""}">1 · 比较自动候选</div><div class="step ${state.edit?"active":""}">2 · 检查地图位置</div><div class="step ${state.edit?"active":""}">3 · 按需微调</div><div class="step ${state.confirmed?"active":""}">4 · 确认并获取地物</div></div>${servicePanel()}<div class="b-content"><section class="b-map card"><div class="b-maphead"><div class="row"><div><strong>${active().name}</strong><div class="tiny muted">${active().reason}</div></div><div class="spacer"></div><span class="pill ${active().valid?"":"bad"}">${active().valid?"可审核":"不可使用"}</span></div></div>${mapSvg()}</section><aside class="b-side card">${evidence()}<hr style="border:0;border-top:1px solid var(--line);margin:15px 0">${editToolbar()}</aside></div><div class="b-candidates">${candidateCards(true)}</div><div class="b-bottom"><span class="muted tiny">${state.edit?"完成点/边调整后确认":"可直接确认推荐候选，或先调整"}</span><div class="spacer"></div><button data-action="back">返回校区确认</button><button class="primary" data-action="confirm" ${!active().valid||state.service!=="ready"?"disabled":""}>${state.confirmed?"✓ 已保存边界":"确认边界并继续"}</button></div></main>`}
    function variantC(){return `<main class="c-shell">${mapSvg()}<section class="c-context"><div class="eyebrow">当前项目 · Campus Boundary</div><h2>${active().name}</h2><p class="tiny muted">${active().source}</p><div class="candidate-tabs">${candidates.map((c,i)=>`<button class="small ${i===state.candidate?"active":""}" data-action="candidate" data-index="${i}">${c.valid?i+1:"!"}</button>`).join("")}</div><p class="tiny" style="margin-top:10px">${active().reason}</p>${servicePanel()}</section><div class="c-tools"><button data-action="edit">${state.edit?"完成调整":"调整边界"}</button><button data-action="insert" ${!state.edit||state.selectedEdge===null?"disabled":""}>＋ 插点</button><button data-action="delete" ${!state.edit||state.selectedVertex===null?"disabled":""}>－ 删点</button><button data-action="undo" ${!state.history.length?"disabled":""}>↶ 撤销</button></div><section class="c-sheet"><div class="c-sheet-grid"><div><div class="eyebrow">确认前摘要</div><div class="row"><span class="pill">${state.points.length} 个顶点</span><span class="pill warn">评分 ${active().score}</span><span class="pill ${active().valid?"":"bad"}">${active().coverage}</span></div><p class="tiny muted" style="margin:9px 0 0">只在选中顶点或边后执行调整，地图浏览不会改变边界。</p></div><div class="row" style="justify-content:flex-end"><button data-action="back">返回</button><button class="primary" data-action="confirm" ${!active().valid||state.service!=="ready"?"disabled":""}>${state.confirmed?"✓ 边界已保存":"确认并获取五类地物"}</button></div></div></section></main>`}
    function switcher(){return `<div class="switcher"><button data-action="prev">←</button><span><strong>${state.variant}</strong> — ${variants[state.variant]}</span><button data-action="next">→</button></div>`}
    function renderDebug(){debug.textContent=`PROTOTYPE STATE\nvariant=${state.variant}\ncandidate=${active().id}\nservice=${state.service}\nedit=${state.edit}\nselectedVertex=${state.selectedVertex}\nselectedEdge=${state.selectedEdge}\nvertices=${state.points.length}\nhistory=${state.history.length}\nconfirmed=${state.confirmed}\nlast=${state.last}`}
    function render(){root.innerHTML=(state.variant==="A"?variantA():state.variant==="B"?variantB():variantC())+switcher();renderDebug();bindDrag()}
    function cycle(d){const keys=Object.keys(variants),i=keys.indexOf(state.variant);state.variant=keys[(i+d+keys.length)%keys.length];const u=new URL(location.href);u.searchParams.set("variant",state.variant);history.replaceState({},"",u);state.last=`切换到方案 ${state.variant}`;render()}
    function bindDrag(){document.querySelectorAll(".vertex").forEach(el=>el.addEventListener("pointerdown",e=>{if(!state.edit)return;const i=+el.dataset.index,startX=e.clientX,startY=e.clientY;let moved=false;el.setPointerCapture(e.pointerId);const svg=el.ownerSVGElement;const move=ev=>{if(!moved&&Math.hypot(ev.clientX-startX,ev.clientY-startY)<4)return;if(!moved){snapshot();moved=true;state.selectedVertex=i;state.selectedEdge=null}const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());state.points[i]=[Math.max(20,Math.min(740,p.x)),Math.max(20,Math.min(520,p.y))];el.setAttribute("cx",state.points[i][0]);el.setAttribute("cy",state.points[i][1]);const poly=svg.querySelector(".candidate");poly.setAttribute("points",state.points.map(x=>x.join(",")).join(" "));renderDebug()};const up=()=>{el.removeEventListener("pointermove",move);if(moved){setLast(`已拖动顶点 ${i+1}`);render()}};el.addEventListener("pointermove",move);el.addEventListener("pointerup",up,{once:true})}))}
    document.addEventListener("click",e=>{const t=e.target.closest("[data-action]");if(!t)return;const a=t.dataset.action;if(a==="prev")return cycle(-1);if(a==="next")return cycle(1);if(a==="candidate")return selectCandidate(+t.dataset.index);if(a==="edit"){if(!active().valid)return;state.edit=!state.edit;state.selectedVertex=null;state.selectedEdge=null;setLast(state.edit?"进入边界调整模式":"退出边界调整模式");return render()}if(a==="vertex"){state.selectedVertex=+t.dataset.index;state.selectedEdge=null;state.last=`选择顶点 ${state.selectedVertex+1}`;return render()}if(a==="edge"){state.selectedEdge=+t.dataset.index;state.selectedVertex=null;state.last=`选择边 ${state.selectedEdge+1}`;return render()}if(a==="insert"&&state.selectedEdge!==null){snapshot();const i=state.selectedEdge,p=state.points[i],q=state.points[(i+1)%state.points.length];state.points.splice(i+1,0,[(p[0]+q[0])/2,(p[1]+q[1])/2]);state.selectedVertex=i+1;state.selectedEdge=null;setLast(`已在两点之间插入顶点 ${i+2}`);return render()}if(a==="delete"&&state.selectedVertex!==null&&state.points.length>3){snapshot();const i=state.selectedVertex;state.points.splice(i,1);state.selectedVertex=null;setLast(`已删除顶点 ${i+1}`);return render()}if(a==="undo"&&state.history.length){state.points=state.history.pop();state.selectedVertex=null;state.selectedEdge=null;setLast("已撤销上一次边界调整");return render()}if(a==="reset"){snapshot();state.points=initial[state.candidate].map(p=>[...p]);state.selectedVertex=null;state.selectedEdge=null;setLast("已恢复当前自动候选原状");return render()}if(a==="confirm"){state.confirmed=true;state.edit=false;state.selectedVertex=null;state.selectedEdge=null;setLast("Campus Boundary 已保存；准备沿用同一 Dataset Bundle 获取五类地物");return render()}if(a==="simulate-unavailable"){state.service="unavailable";setLast("模拟：受控服务不可用");return render()}if(a==="simulate-invalid"){state.service="invalid";setLast("模拟：所有自动候选无效");return render()}if(a==="retry"){state.service="ready";setLast("边界候选任务重试成功");return render()}if(a==="back")return setLast("返回 Campus Target 确认，不创建空白边界");if(a==="advanced")return setLast("打开来源、覆盖、排名和派生详情（原型未展开）")});
    document.addEventListener("keydown",e=>{const editing=["INPUT","TEXTAREA"].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable;if(!editing&&e.key==="ArrowLeft")cycle(-1);if(!editing&&e.key==="ArrowRight")cycle(1);if(e.key==="Delete"&&state.edit&&state.selectedVertex!==null)document.querySelector('[data-action="delete"]')?.click()});
    render();
  </script>
</body>
</html>
