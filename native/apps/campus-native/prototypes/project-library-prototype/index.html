<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Campus Project Library</title>
  <style>
    :root {
      --ink: #17251f;
      --muted: #617068;
      --forest: #244a3a;
      --forest-2: #356550;
      --cream: #f4f0e5;
      --paper: #fffdf7;
      --warm: #eee6d6;
      --line: #c7bca8;
      --red: #a54836;
      --red-soft: #f2dcd3;
      --green-soft: #dfe9df;
      --gold-soft: #efe4bd;
      --shadow: 0 18px 50px rgba(34, 48, 41, .13);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--cream); color: var(--ink); }
    body { font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(165,72,54,.32); outline-offset: 2px; }
    .prototype-banner {
      height: 30px; display: flex; align-items: center; justify-content: center;
      background: #17251f; color: #f8f1df; font-size: 12px; letter-spacing: .08em;
    }
    .app-shell { min-height: calc(100vh - 30px); padding-bottom: 96px; }
    .topbar {
      height: 68px; display: flex; align-items: center; gap: 14px; padding: 0 24px;
      background: var(--warm); border-bottom: 2px solid var(--forest);
    }
    .brand { font-size: 21px; font-weight: 800; }
    .divider { width: 1px; height: 30px; background: var(--line); }
    .top-note { color: var(--muted); font-size: 13px; }
    .spacer { flex: 1; }
    .quiet-button, .secondary-button, .primary-button, .danger-button {
      border: 1px solid var(--line); border-radius: 7px; padding: 9px 13px; background: var(--paper); color: var(--ink);
    }
    .quiet-button:hover, .secondary-button:hover { border-color: var(--forest-2); background: #faf6eb; }
    .primary-button { background: var(--forest); color: white; border-color: var(--forest); font-weight: 700; }
    .primary-button:hover { background: var(--forest-2); }
    .danger-button { color: var(--red); border-color: #d2a89e; background: #fff8f5; }
    .eyebrow { color: var(--red); font-size: 12px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 31px; line-height: 1.2; margin-bottom: 10px; }
    h2 { font-size: 22px; margin-bottom: 8px; }
    h3 { font-size: 16px; margin-bottom: 6px; }
    .muted { color: var(--muted); }
    .tiny { font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #4d8b68; margin-right: 6px; }
    .pill { display: inline-flex; align-items: center; padding: 5px 9px; border-radius: 999px; font-size: 12px; background: var(--green-soft); color: #294f3d; }
    .pill.warn { background: var(--gold-soft); color: #705b1f; }
    .pill.neutral { background: #ebe6dc; color: #5b625e; }
    .save-ok { color: #356550; font-weight: 700; font-size: 13px; }
    .progress { height: 7px; border-radius: 99px; background: #ded7c9; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--forest-2); }
    .project-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* A — strict two-step table */
    .variant-a .stage { max-width: 1180px; margin: 0 auto; padding: 34px 28px; }
    .step-rail { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
    .step-tab { padding: 15px 18px; background: #e6dfd2; border: 1px solid var(--line); color: var(--muted); }
    .step-tab:first-child { border-radius: 10px 0 0 10px; }
    .step-tab:last-child { border-radius: 0 10px 10px 0; }
    .step-tab.active { background: var(--forest); color: white; border-color: var(--forest); }
    .campus-confirm-card { display: grid; grid-template-columns: 1.3fr .7fr; gap: 28px; padding: 28px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
    .campus-map-placeholder { min-height: 210px; border-radius: 10px; background:
      linear-gradient(145deg, rgba(36,74,58,.08), rgba(165,72,54,.07)),
      repeating-linear-gradient(35deg, transparent 0 28px, rgba(97,112,104,.12) 29px 31px), #e8e5d7;
      position: relative; overflow: hidden; border: 1px solid #d2cab9;
    }
    .campus-map-placeholder::after { content: "上次使用的校区位置"; position: absolute; left: 18px; bottom: 16px; padding: 7px 10px; background: rgba(255,253,247,.92); border-radius: 6px; font-size: 12px; }
    .campus-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
    .fact { padding: 12px; background: #f5f0e5; border-radius: 8px; }
    .fact strong { display: block; margin-bottom: 4px; }
    .library-table { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
    .library-toolbar { display: flex; align-items: center; gap: 10px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .project-row { display: grid; grid-template-columns: 1.5fr .8fr 1fr 1.35fr; gap: 18px; padding: 18px 20px; align-items: center; border-bottom: 1px solid #e1d9ca; }
    .project-row:last-child { border-bottom: 0; }
    .project-row:hover { background: #fbf7ee; }

    /* B — campus hub */
    .variant-b .hub { display: grid; grid-template-columns: 310px minmax(0, 1fr); min-height: calc(100vh - 98px); }
    .campus-sidebar { padding: 28px 22px; background: #20392f; color: #f6efde; }
    .campus-sidebar .eyebrow { color: #e7aa98; }
    .campus-sidebar .muted { color: #b8c7bf; }
    .campus-chip { padding: 14px; border-radius: 10px; margin: 16px 0; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); }
    .campus-nav { display: grid; gap: 8px; margin-top: 26px; }
    .campus-nav button { text-align: left; border: 0; border-radius: 8px; padding: 11px 12px; background: transparent; color: #e8eee9; }
    .campus-nav button.active, .campus-nav button:hover { background: rgba(255,255,255,.11); }
    .hub-main { padding: 30px 34px; }
    .hub-heading { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 24px; }
    .project-groups { display: grid; grid-template-columns: 1.15fr .85fr; gap: 20px; }
    .group-panel { background: var(--paper); border: 1px solid var(--line); border-radius: 13px; padding: 20px; }
    .project-card { border: 1px solid #d8cebd; border-radius: 10px; padding: 16px; margin-top: 12px; background: #fcf9f1; }
    .project-card.featured { border-left: 5px solid var(--red); }
    .project-card-top { display: flex; align-items: start; gap: 12px; }
    .timeline { margin: 18px 0 8px; display: grid; gap: 8px; }
    .timeline-item { display: grid; grid-template-columns: 22px 1fr; gap: 9px; font-size: 13px; color: var(--muted); }
    .timeline-item .node { width: 13px; height: 13px; border-radius: 50%; background: #d1c9bb; margin-top: 3px; }
    .timeline-item.done .node { background: var(--forest-2); }
    .timeline-item.current { color: var(--ink); font-weight: 700; }
    .timeline-item.current .node { background: var(--red); box-shadow: 0 0 0 4px var(--red-soft); }

    /* C — resume-first */
    .variant-c .command-center { max-width: 1220px; margin: 0 auto; padding: 28px; }
    .campus-strip { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border: 1px solid var(--line); background: rgba(255,253,247,.72); border-radius: 10px; }
    .resume-hero { margin-top: 20px; display: grid; grid-template-columns: 1.4fr .6fr; min-height: 290px; background: var(--forest); color: white; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
    .resume-copy { padding: 34px; }
    .resume-copy .eyebrow { color: #efb7a8; }
    .resume-copy .muted { color: #c5d2cb; }
    .resume-visual { padding: 28px; background: rgba(255,255,255,.07); display: flex; flex-direction: column; justify-content: center; }
    .next-task { padding: 18px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.12); border-radius: 12px; }
    .command-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 18px; }
    .command-card { min-height: 158px; padding: 20px; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; }
    .command-card button { margin-top: 10px; }
    .recent-drawer { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 18px; }
    .recent-line { display: grid; grid-template-columns: 1.2fr 1fr .8fr auto; gap: 14px; align-items: center; padding: 13px 0; border-bottom: 1px solid #ddd4c5; }

    .prototype-switcher {
      position: fixed; z-index: 50; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 999px;
      background: #101b16; color: white; box-shadow: 0 12px 34px rgba(0,0,0,.3);
    }
    .prototype-switcher button { width: 36px; height: 36px; border: 0; border-radius: 50%; color: white; background: #2f493e; font-size: 18px; }
    .variant-label { min-width: 205px; text-align: center; font-size: 13px; }
    .debug-state {
      position: fixed; z-index: 45; left: 16px; bottom: 16px; width: 300px; padding: 10px 12px;
      border: 1px dashed #8f806a; background: rgba(255,253,247,.94); color: #4f5e56; font: 11px/1.45 Consolas, monospace;
    }
    .toast { position: fixed; z-index: 60; right: 20px; top: 48px; max-width: 420px; padding: 13px 16px; border-radius: 9px; background: #17251f; color: white; box-shadow: var(--shadow); }
    .modal-backdrop { position: fixed; z-index: 70; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(20,31,26,.52); }
    .modal { width: min(620px, 100%); max-height: 85vh; overflow: auto; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 24px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    .campus-result { padding: 13px; border: 1px solid var(--line); border-radius: 9px; margin: 10px 0; }
    .campus-result.selected { border-color: var(--forest); background: var(--green-soft); }
    .field { display: grid; gap: 6px; margin: 14px 0; }
    .field input { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 7px; background: white; }
    @media (max-width: 920px) {
      .variant-b .hub, .campus-confirm-card, .resume-hero, .project-groups { grid-template-columns: 1fr; }
      .campus-sidebar { min-height: auto; }
      .command-grid { grid-template-columns: 1fr; }
      .project-row { grid-template-columns: 1fr; }
      .debug-state { display: none; }
    }
  </style>
</head>
<body>
  <div class="prototype-banner">THROWAWAY PROTOTYPE · 所有操作仅修改内存状态 · 不会读写真实项目</div>
  <div id="root"></div>
  <div id="debug" class="debug-state"></div>
  <div id="toast"></div>
  <script>
    const variants = {
      A: "明确两步 · 校区确认 → 项目表格",
      B: "校园中心 · 上下文侧栏 + 项目分组",
      C: "恢复优先 · 下一个未完成任务"
    };
    const projectCatalog = {
      "华东师范大学普陀校区": [
        { id: "putuo-main", name: "普陀校区主复刻", modified: "今天 16:42", progress: 62, next: "审核水域", saved: "已保存", status: "进行中" },
        { id: "putuo-foundation", name: "地基方案对照", modified: "7 月 14 日", progress: 100, next: "已完成", saved: "已保存", status: "已完成" },
        { id: "putuo-night", name: "夜景材质实验", modified: "7 月 10 日", progress: 28, next: "确认校区朝向", saved: "有恢复副本", status: "草稿" }
      ],
      "华东师范大学闵行校区": [
        { id: "minhang-import", name: "闵行校园基础复刻", modified: "刚刚导入", progress: 44, next: "审核建筑", saved: "已保存", status: "进行中" }
      ]
    };
    const state = {
      variant: new URLSearchParams(location.search).get("variant") || "A",
      campus: "华东师范大学普陀校区",
      campusConfirmed: false,
      selectedProject: "putuo-main",
      modal: null,
      importedCampus: "华东师范大学闵行校区",
      lastAction: "等待用户确认 Campus Target"
    };
    const currentProjects = () => projectCatalog[state.campus] || [];
    if (!variants[state.variant]) state.variant = "A";

    const root = document.getElementById("root");
    const debug = document.getElementById("debug");
    const toastHost = document.getElementById("toast");
    const esc = value => String(value).replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
    function setAction(message) { state.lastAction = message; renderDebug(); showToast(message); }
    function showToast(message) {
      toastHost.innerHTML = `<div class="toast">${esc(message)}</div>`;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastHost.innerHTML = "", 2600);
    }
    function renderDebug() {
      debug.textContent = `PROTOTYPE STATE\nvariant=${state.variant}\ncampus=${state.campus}\nconfirmed=${state.campusConfirmed}\nselectedProject=${state.selectedProject}\nmodal=${state.modal || "none"}\nlastAction=${state.lastAction}`;
    }
    function topbar(note) {
      return `<div class="topbar">
        <div class="brand">MC 校园复刻</div><div class="divider"></div><div class="top-note">${note}</div>
        <div class="spacer"></div><button class="quiet-button" data-action="language">EN</button><button class="quiet-button" data-action="settings">设置</button>
      </div>`;
    }
    function campusGate(inner) {
      if (state.campusConfirmed) return inner;
      return `<main class="stage">
        <div class="step-rail"><div class="step-tab active">1 · 确认复刻校区</div><div class="step-tab">2 · 选择项目</div></div>
        <section class="campus-confirm-card">
          <div>
            <div class="eyebrow">上次使用的 Campus Target</div>
            <h1>${esc(state.campus)}</h1>
            <p class="muted">先确认复刻校区，再查看这个校区下的本地项目。确认不会重新查询或修改任何项目。</p>
            <div class="campus-facts">
              <div class="fact"><strong>${currentProjects().length} 个</strong><span class="muted tiny">本地项目</span></div>
              <div class="fact"><strong>今天 16:42</strong><span class="muted tiny">最近使用</span></div>
              <div class="fact"><strong>在线</strong><span class="muted tiny">高德服务状态</span></div>
            </div>
            <div class="project-actions">
              <button class="primary-button" data-action="confirm-campus">继续此校区</button>
              <button class="secondary-button" data-action="switch-campus">搜索其他高校</button>
              <button class="secondary-button" data-action="import-project">导入便携项目</button>
            </div>
          </div>
          <div class="campus-map-placeholder"></div>
        </section>
      </main>`;
    }
    function variantA() {
      const projects = currentProjects();
      const rows = projects.map(project => `<div class="project-row">
        <div><h3>${project.name}</h3><div class="muted tiny">${project.modified} · ${project.saved}</div></div>
        <div><span class="pill ${project.status === "已完成" ? "" : project.status === "草稿" ? "neutral" : "warn"}">${project.status}</span></div>
        <div><div class="tiny muted">${project.progress}% · ${project.next}</div><div class="progress"><span style="width:${project.progress}%"></span></div></div>
        <div class="project-actions"><button class="primary-button" data-action="open-project" data-id="${project.id}">${project.status === "已完成" ? "查看项目" : "继续项目"}</button><button class="quiet-button" data-action="export-copy" data-id="${project.id}">导出副本</button></div>
      </div>`).join("");
      return `<div class="app-shell variant-a">${topbar(state.campus)}${campusGate(`<main class="stage">
        <div class="step-rail"><div class="step-tab">✓ 已确认：${esc(state.campus)}</div><div class="step-tab active">2 · 选择项目</div></div>
        <section class="library-table">
          <div class="library-toolbar"><div><div class="eyebrow">Campus Project Library</div><h2>本地项目</h2></div><div class="spacer"></div><span class="save-ok"><span class="status-dot"></span>全部已安全保存</span><button class="secondary-button" data-action="switch-campus">切换校区</button><button class="secondary-button" data-action="import-project">导入项目</button><button class="primary-button" data-action="new-project">新建项目</button></div>
          ${rows}
        </section>
      </main>`)}</div>`;
    }
    function variantB() {
      const projects = currentProjects();
      const active = projects.filter(p => p.status !== "已完成").map(project => `<div class="project-card ${project.id === "putuo-main" ? "featured" : ""}">
        <div class="project-card-top"><div><h3>${project.name}</h3><div class="muted tiny">${project.modified} · ${project.saved}</div></div><div class="spacer"></div><span class="pill warn">${project.status}</span></div>
        <div class="timeline">
          <div class="timeline-item done"><span class="node"></span><span>Campus Target 与边界</span></div>
          <div class="timeline-item done"><span class="node"></span><span>建筑与道路审核</span></div>
          <div class="timeline-item current"><span class="node"></span><span>${project.next}</span></div>
        </div>
        <div class="project-actions"><button class="primary-button" data-action="open-project" data-id="${project.id}">继续下一任务</button><button class="quiet-button" data-action="export-copy" data-id="${project.id}">导出副本</button></div>
      </div>`).join("");
      const completed = projects.filter(p => p.status === "已完成").map(project => `<div class="project-card"><h3>${project.name}</h3><p class="muted tiny">${project.modified} · ${project.saved}</p><button class="secondary-button" data-action="open-project" data-id="${project.id}">查看</button></div>`).join("");
      const content = `<div class="hub">
        <aside class="campus-sidebar"><div class="eyebrow">当前 Campus Target</div><h2>${esc(state.campus)}</h2><p class="muted">项目只在这个校区的项目库中显示。</p><div class="campus-chip"><span class="status-dot"></span>高德身份已确认<br><span class="muted tiny">3 个本地项目 · 最近今天使用</span></div><div class="campus-nav"><button class="active">项目库</button><button data-action="new-project">新建项目</button><button data-action="import-project">导入便携项目</button><button data-action="switch-campus">切换高校</button></div></aside>
        <main class="hub-main"><div class="hub-heading"><div><div class="eyebrow">Campus Project Library</div><h1>从未完成处继续</h1><p class="muted">应用持续保存项目。选择项目后直接进入下一个未完成任务。</p></div><div class="spacer"></div><span class="save-ok"><span class="status-dot"></span>全部已保存</span></div>
          <div class="project-groups"><section class="group-panel"><h2>进行中的项目</h2>${active}</section><section class="group-panel"><h2>已完成与归档</h2>${completed}<button class="secondary-button" style="margin-top:14px" data-action="new-project">＋ 新建独立项目</button></section></div>
        </main>
      </div>`;
      return `<div class="app-shell variant-b">${topbar("校园中心")}${campusGate(content)}</div>`;
    }
    function variantC() {
      const projects = currentProjects();
      const main = projects[0];
      const content = `<main class="command-center">
        <div class="campus-strip"><div><div class="eyebrow">已确认的复刻校区</div><strong>${esc(state.campus)}</strong></div><div class="spacer"></div><span class="save-ok"><span class="status-dot"></span>项目库已同步到本地磁盘</span><button class="quiet-button" data-action="switch-campus">切换校区</button></div>
        <section class="resume-hero"><div class="resume-copy"><div class="eyebrow">建议继续</div><h1>${main.name}</h1><p class="muted">上次停在“${main.next}”。已完成的校区、边界、朝向、建筑和道路任务将自动跳过。</p><div class="progress" style="background:rgba(255,255,255,.18);max-width:520px"><span style="width:${main.progress}%;background:#e4b3a5"></span></div><p class="tiny muted" style="margin-top:8px">${main.progress}% · ${main.modified} · ${main.saved}</p><button class="primary-button" style="background:white;color:#20392f;border-color:white" data-action="open-project" data-id="${main.id}">继续：${main.next} →</button></div><div class="resume-visual"><div class="next-task"><div class="eyebrow">下一任务</div><h2>${main.next}</h2><p class="muted">进入项目后只展示当前未完成部分。完成项仍可回看。</p></div></div></section>
        <div class="command-grid"><section class="command-card"><div class="eyebrow">从头开始</div><h3>新建独立项目</h3><p class="muted tiny">当前校区的新项目不会继承其他项目的边界或审核状态。</p><button class="secondary-button" data-action="new-project">新建项目</button></section><section class="command-card"><div class="eyebrow">带入已有工作</div><h3>导入便携项目</h3><p class="muted tiny">如果文件属于其他校区，先保存当前项目，再自动切换 Campus Target。</p><button class="secondary-button" data-action="import-project">导入项目</button></section><section class="command-card"><div class="eyebrow">其他高校</div><h3>切换 Campus Target</h3><p class="muted tiny">搜索并确认高校后，再查看对应的本地项目库。</p><button class="secondary-button" data-action="switch-campus">搜索高校</button></section></div>
        <section class="recent-drawer"><div class="eyebrow">其他本地项目</div>${projects.slice(1).map(project => `<div class="recent-line"><strong>${project.name}</strong><span class="muted tiny">${project.next}</span><span class="tiny">${project.modified}</span><button class="quiet-button" data-action="open-project" data-id="${project.id}">打开</button></div>`).join("")}</section>
      </main>`;
      return `<div class="app-shell variant-c">${topbar("任务恢复")}${campusGate(content)}</div>`;
    }
    function modal() {
      if (!state.modal) return "";
      if (state.modal === "campus") return `<div class="modal-backdrop"><div class="modal"><div class="eyebrow">切换 Campus Target</div><h2>搜索其他高校</h2><div class="field"><label>学校或校区名称</label><input value="华东师范大学" /></div><div class="campus-result selected"><strong>华东师范大学普陀校区</strong><div class="muted tiny">上海市普陀区 · 上次使用</div></div><div class="campus-result"><strong>华东师范大学闵行校区</strong><div class="muted tiny">上海市闵行区 · 高德搜索结果</div></div><p class="muted tiny">确认新校区前，应用会先安全保存当前项目。保存失败则不切换。</p><div class="modal-actions"><button class="quiet-button" data-action="close-modal">取消</button><button class="primary-button" data-action="confirm-other-campus">确认闵行校区</button></div></div></div>`;
      if (state.modal === "import") return `<div class="modal-backdrop"><div class="modal"><div class="eyebrow">导入便携项目</div><h2>文件属于另一个 Campus Target</h2><p>准备导入“闵行校园基础复刻.campus.json”。文件内 Campus Target 为：</p><div class="campus-result selected"><strong>${state.importedCampus}</strong><div class="muted tiny">与当前 ${esc(state.campus)} 不同</div></div><ol class="muted"><li>先自动保存当前项目。</li><li>把导入文件复制为新的本地项目。</li><li>切换到文件内校区并打开其项目库。</li></ol><p class="tiny muted">原始文件不会被修改；重名项目会自动生成副本名称。</p><div class="modal-actions"><button class="quiet-button" data-action="close-modal">取消</button><button class="primary-button" data-action="confirm-import">保存并导入</button></div></div></div>`;
      if (state.modal === "new") return `<div class="modal-backdrop"><div class="modal"><div class="eyebrow">新建 Campus Reconstruction Project</div><h2>${esc(state.campus)}</h2><p class="muted">新项目从头开始，不继承其他项目的边界和审核结果。</p><div class="field"><label>项目名称</label><input id="new-project-name" value="新的校园复刻" /></div><div class="modal-actions"><button class="quiet-button" data-action="close-modal">取消</button><button class="primary-button" data-action="confirm-new">创建项目</button></div></div></div>`;
      return "";
    }
    function switcher() {
      return `<div class="prototype-switcher"><button aria-label="上一个方案" data-action="prev-variant">←</button><div class="variant-label"><strong>${state.variant}</strong> — ${variants[state.variant]}</div><button aria-label="下一个方案" data-action="next-variant">→</button></div>`;
    }
    function render() {
      root.innerHTML = (state.variant === "A" ? variantA() : state.variant === "B" ? variantB() : variantC()) + modal() + switcher();
      renderDebug();
    }
    function cycle(direction) {
      const keys = Object.keys(variants); const current = keys.indexOf(state.variant); state.variant = keys[(current + direction + keys.length) % keys.length];
      const url = new URL(location.href); url.searchParams.set("variant", state.variant); history.replaceState({}, "", url); state.lastAction = `切换到方案 ${state.variant}`; render();
    }
    document.addEventListener("click", event => {
      const target = event.target.closest("[data-action]"); if (!target) return;
      const action = target.dataset.action;
      if (action === "prev-variant") return cycle(-1); if (action === "next-variant") return cycle(1);
      if (action === "confirm-campus") { state.campusConfirmed = true; setAction(`已确认 ${state.campus}，显示该校区项目库`); return render(); }
      if (action === "switch-campus") { state.modal = "campus"; state.lastAction = "打开 Campus Target 搜索"; return render(); }
      if (action === "import-project") { state.modal = "import"; state.lastAction = "检查导入文件 Campus Target"; return render(); }
      if (action === "new-project") { state.modal = "new"; state.lastAction = "准备新建独立项目"; return render(); }
      if (action === "close-modal") { state.modal = null; state.lastAction = "取消当前对话框"; return render(); }
      if (action === "confirm-other-campus") { state.campus = "华东师范大学闵行校区"; state.selectedProject = currentProjects()[0]?.id || ""; state.campusConfirmed = true; state.modal = null; setAction("当前项目已保存；已切换到闵行校区项目库"); return render(); }
      if (action === "confirm-import") { state.campus = state.importedCampus; state.selectedProject = "minhang-import"; state.campusConfirmed = true; state.modal = null; setAction("当前项目已保存；导入副本已加入闵行校区项目库"); return render(); }
      if (action === "confirm-new") { const name = document.querySelector("#new-project-name")?.value || "新的校园复刻"; const id = `local-${Date.now()}`; projectCatalog[state.campus] ||= []; projectCatalog[state.campus].unshift({id,name,modified:"刚刚创建",progress:0,next:"获取 Campus Boundary",saved:"已保存",status:"草稿"}); state.selectedProject = id; state.modal = null; setAction("已创建独立项目；下一步进入 Campus Boundary 获取"); return render(); }
      if (action === "open-project") { state.selectedProject = target.dataset.id; const project = currentProjects().find(p => p.id === state.selectedProject); setAction(`打开 ${project.name}；进入 ${project.next}`); return renderDebug(); }
      if (action === "export-copy") { const project = currentProjects().find(p => p.id === target.dataset.id); return setAction(`立即保存完成；准备导出 ${project.name} 的便携副本`); }
      if (action === "settings") return setAction("打开设置（原型未展开）");
      if (action === "language") return setAction("切换语言（原型保持中文以便比较布局）");
    });
    document.addEventListener("keydown", event => {
      const tag = document.activeElement?.tagName; const editing = tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable;
      if (!editing && event.key === "ArrowLeft") cycle(-1);
      if (!editing && event.key === "ArrowRight") cycle(1);
      if (event.key === "Escape" && state.modal) { state.modal = null; state.lastAction = "Esc 关闭对话框"; render(); }
    });
    render();
  </script>
</body>
</html>
