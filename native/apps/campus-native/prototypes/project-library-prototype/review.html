<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Foundation Review</title>
  <!-- Three Foundation Review variants, switchable via ?variant=, inside the existing campus/project shell. -->
  <style>
    :root{--ink:#17251f;--muted:#66736c;--forest:#244a3a;--forest2:#356550;--cream:#f4f0e5;--paper:#fffdf7;--warm:#eee6d6;--line:#c8bcaa;--red:#a54836;--red2:#f2dcd3;--green:#dfe9df;--gold:#efe4bd;--blue:#315f78;--purple:#70528c;--shadow:0 18px 48px rgba(26,45,36,.14)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink)}body,button{font-family:"Microsoft YaHei UI","Segoe UI",sans-serif}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:focus-visible,[tabindex]:focus-visible{outline:3px solid rgba(165,72,54,.32);outline-offset:2px}
    .proto{height:28px;display:flex;align-items:center;justify-content:center;background:#15221c;color:#fff7e8;font-size:11px;letter-spacing:.08em}.topbar{height:66px;display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--warm);border-bottom:2px solid var(--forest)}.brand{font-size:20px;font-weight:850}.divider{height:30px;width:1px;background:var(--line)}.crumb{font-size:13px;color:var(--muted)}.spacer{flex:1}.save{font-size:12px;font-weight:750;color:var(--forest2)}
    button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--paper);color:var(--ink)}button:hover:not(:disabled){border-color:var(--forest2)}.primary{background:var(--forest);border-color:var(--forest);color:white;font-weight:750}.danger{color:var(--red);border-color:#d5aba0;background:#fff8f5}.quiet{background:transparent}.small{padding:7px 9px;font-size:12px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}h1,h2,h3,p{margin-top:0}h1{font-size:27px;margin-bottom:7px}h2{font-size:20px;margin-bottom:7px}h3{font-size:15px;margin-bottom:5px}.muted{color:var(--muted)}.tiny{font-size:11px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.stack{display:grid;gap:10px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
    .pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;font-size:11px;background:var(--green);color:#28503c}.pill.warn{background:var(--gold);color:#705b1f}.pill.bad{background:var(--red2);color:#873727}.pill.coarse{background:#e8def1;color:#63417e}.pill.info{background:#dcebf0;color:#315f78}.notice{padding:11px;border-left:4px solid var(--blue);background:#edf4f5;font-size:12px}.notice.warn{border-color:#c38627;background:#fff7e3}.notice.bad{border-color:var(--red);background:#fff0ec}.notice.good{border-color:var(--forest2);background:#edf5ec}
    .map{position:relative;min-height:510px;overflow:hidden;background:#e6e3d7}.map svg{display:block;width:100%;height:100%;min-height:510px}.map-grid{stroke:#c9c7bb;stroke-width:1}.road-bg{fill:none;stroke:#fffdf6;stroke-width:15;stroke-linecap:round}.water-bg{fill:#bcd4d8;stroke:#6d9daa;stroke-width:1}.building-bg{fill:#d7cab4;stroke:#9b8b71;stroke-width:1}.feat{cursor:pointer;stroke-width:5;vector-effect:non-scaling-stroke}.feat.pending{stroke:#d08b32;fill:rgba(208,139,50,.24)}.feat.accepted{stroke:#266044;fill:rgba(38,96,68,.22)}.feat.rejected{stroke:#9e4a3b;fill:rgba(158,74,59,.08);stroke-dasharray:8 6;opacity:.62}.feat.conflict{stroke:#a54836;fill:rgba(165,72,54,.18);stroke-dasharray:4 4}.feat.supporting{stroke:#315f78;fill:rgba(49,95,120,.16)}.feat.selected{stroke:#111!important;stroke-width:8!important;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}.feat.coarse{stroke:var(--purple);stroke-dasharray:11 7}.map-label{font-size:11px;fill:#42534a}.map-badge{position:absolute;right:14px;top:14px;padding:7px 10px;border-radius:99px;background:rgba(23,37,31,.9);color:white;font-size:11px}.legend{position:absolute;left:14px;bottom:14px;display:flex;gap:7px;flex-wrap:wrap;padding:8px 10px;background:rgba(255,253,247,.94);border:1px solid var(--line);border-radius:8px;font-size:10px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot.pending{background:#d08b32}.dot.accepted{background:#266044}.dot.rejected{background:#9e4a3b}.dot.conflict{background:#a54836}
    .layer-button{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:9px;width:100%;text-align:left;padding:11px;border:1px solid #d8cebd;background:#fcf9f1}.layer-button.active{border:2px solid var(--forest);padding:10px;background:#edf4eb}.layer-button.complete{background:#eff4ec}.layer-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#e5dece;font-size:17px}.layer-meta strong{display:block}.layer-meta span{font-size:10px;color:var(--muted)}.count{font-size:12px;font-weight:800;color:var(--red)}
    .candidate-card{padding:11px;border:1px solid #d8cebd;border-radius:9px;background:#fcf9f1;cursor:pointer}.candidate-card.selected{border:2px solid var(--forest);padding:10px;background:#eff4ec}.candidate-card h3{margin-bottom:4px}.candidate-card input{accent-color:var(--forest)}.state-label{font-size:10px;font-weight:800;text-transform:uppercase}.state-label.pending,.state-label.conflict{color:#a25c15}.state-label.accepted{color:#286045}.state-label.rejected{color:#99483a}.state-label.supporting{color:#315f78}
    .provider{display:grid;grid-template-columns:1fr auto;gap:6px;padding:9px;background:#f3ede2;border-radius:8px;font-size:11px}.provider strong{display:block}.assessment{display:grid;grid-template-columns:1fr 1fr;gap:7px}.assessment div{padding:8px;background:#f3ede2;border-radius:7px;font-size:10px}.assessment strong{display:block;font-size:12px}.gap-card{padding:10px;border:1px solid #d7ad7c;background:#fff6df;border-radius:8px;font-size:11px}.gap-card.ack{border-color:#8eaa8f;background:#eef5eb}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action-grid .wide{grid-column:1/-1}.no-draw{font-size:11px;color:var(--muted);padding:9px;border:1px dashed var(--line);border-radius:8px;background:#f8f3e9}
    .a-shell{display:grid;grid-template-columns:245px minmax(450px,1fr) 330px;height:calc(100vh - 94px);min-height:650px}.a-layers,.a-detail{overflow:auto;padding:16px;background:#f1eadc}.a-layers{border-right:1px solid var(--line)}.a-detail{border-left:1px solid var(--line)}.a-center{display:grid;grid-template-rows:auto 1fr;min-width:0}.a-maphead{padding:13px 16px;background:var(--paper);border-bottom:1px solid var(--line)}.a-center .map,.a-center .map svg{min-height:100%;height:100%}.a-complete{position:fixed;z-index:20;left:245px;right:330px;bottom:74px;display:flex;align-items:center;gap:12px;padding:11px 14px;background:rgba(255,253,247,.98);border:1px solid var(--line);box-shadow:0 -10px 28px rgba(26,45,36,.14)}.a-complete .primary{margin-left:auto}
    .b-shell{max-width:1500px;margin:0 auto;padding:17px 22px 100px}.b-layer-tabs{display:flex;gap:8px;margin:11px 0}.b-layer-tabs button.active{background:var(--forest);color:white;border-color:var(--forest)}.b-grid{display:grid;grid-template-columns:310px minmax(440px,1fr) 320px;gap:14px}.b-queue,.b-decision{padding:14px;max-height:calc(100vh - 235px);overflow:auto}.b-map{overflow:hidden}.queue-toolbar{display:flex;gap:7px;position:sticky;top:-14px;background:var(--paper);padding:0 0 10px;z-index:2}.b-bottom{position:fixed;z-index:18;left:22px;right:22px;bottom:74px;display:flex;align-items:center;gap:10px;padding:11px 14px;background:rgba(255,253,247,.97);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.progress{height:8px;min-width:180px;flex:1;background:#ddd4c5;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--forest)}
    .c-shell{height:calc(100vh - 94px);min-height:650px;position:relative;overflow:hidden}.c-shell .map,.c-shell .map svg{height:100%;min-height:100%}.c-layers{position:absolute;z-index:6;left:16px;top:16px;width:225px;padding:10px;background:rgba(255,253,247,.95);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.c-layers .layer-button{grid-template-columns:28px 1fr auto;padding:8px}.c-layers .layer-button.active{padding:7px}.c-layers .layer-icon{width:28px;height:28px;font-size:14px}.c-gaps{position:absolute;z-index:6;right:16px;top:16px;width:280px;padding:13px;background:rgba(255,253,247,.96);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.c-sheet{position:absolute;z-index:8;left:50%;bottom:96px;transform:translateX(-50%);width:min(850px,calc(100% - 36px));padding:14px 16px;background:rgba(255,253,247,.97);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.c-sheet-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.c-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
    .switcher{position:fixed;z-index:30;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:99px;background:#101b16;color:white;box-shadow:0 12px 32px rgba(0,0,0,.32)}.switcher button{width:34px;height:34px;padding:0;border-radius:50%;border:0;background:#304a3f;color:white}.switcher span{min-width:240px;text-align:center;font-size:12px}.debug{position:fixed;z-index:25;left:10px;bottom:10px;width:305px;padding:8px 10px;background:rgba(255,253,247,.94);border:1px dashed #8f806a;font:9px/1.4 Consolas,monospace;color:#4f5e56}.toast{position:fixed;z-index:50;right:18px;top:44px;max-width:430px;padding:12px 15px;background:#17251f;color:white;border-radius:9px;box-shadow:var(--shadow)}
    @media(max-width:1050px){.a-shell{grid-template-columns:220px 1fr}.a-detail{display:none}.a-complete{left:220px;right:0}.b-grid{grid-template-columns:280px 1fr}.b-decision{display:none}.c-gaps{display:none}.debug{display:none}}@media(max-width:720px){.topbar .save,.topbar .quiet{display:none}.a-shell{display:block;height:auto}.a-layers{border:0}.a-complete{left:0;right:0}.a-complete .tiny{display:none}.b-grid{grid-template-columns:1fr}.b-layer-tabs{overflow:auto}.c-layers{width:190px}.c-sheet-grid{grid-template-columns:1fr}.switcher span{min-width:170px}}
  </style>
</head>
<body>
  <div class="proto">THROWAWAY PROTOTYPE · 审核操作只修改内存 · 不连接真实服务 · 不提供五类地物手绘</div>
  <div class="topbar"><div class="brand">MC 校园复刻</div><div class="divider"></div><div class="crumb">华东师范大学普陀校区 / 普陀校区主复刻 / Foundation Review</div><div class="spacer"></div><span class="save">● 已保存 · 17:28</span><button class="quiet">设置</button></div>
  <div id="root"></div><div id="debug" class="debug"></div><div id="toast"></div>
  <script>
    const variants={A:"五层证据台",B:"待办队列工作台",C:"全屏地图审核"};
    const layerOrder=["building","circulation","water","vegetation","sports"];
    const layerNames={building:"建筑",circulation:"道路",water:"水域",vegetation:"植被",sports:"体育设施"};
    const layerIcons={building:"▦",circulation:"⇢",water:"≈",vegetation:"♧",sports:"◉"};
    const layers={
      building:{acquisition:"完整 · 24/24 分块",providers:[{name:"OSM",status:"完整",detail:"18 条 source records"},{name:"Overture",status:"完整",detail:"16 条 source records"}],completed:false,gaps:[],candidates:[
        {id:"b-ecnu-01",name:"文史楼 Building Entity",kind:"建筑",source:"OSM way 83102 + Overture place 7f2",dataset:"osm-2026-07-01 / overture-2026-06-17.0",lineage:"2 条来源 · 同一实体候选",priority:"高优先",state:"conflict",coarse:false,assessment:["几何：两形状高度重合","语义：均为 building","实体：待确认合并","名称：文史楼候选"],reason:"两个候选位置高度重合但轮廓不同，需要决定一个实体、部件或分开。",shape:'<polygon points="265,150 390,132 425,238 284,252"/>'},

        {id:"b-ecnu-03",name:"东侧无名建筑",kind:"建筑",source:"Overture building 4ca",dataset:"overture-2026-06-17.0",lineage:"1 条来源 · 无名称",priority:"普通",state:"pending",coarse:false,assessment:["几何：有效","语义：building","实体：无冲突","名称：未知"],reason:"几何可用，但没有可靠名称；可接受为无名 Building Entity。",shape:'<polygon points="615,245 690,250 686,328 608,320"/>'},
        {id:"b-ecnu-04",name:"校外商业建筑",kind:"建筑",source:"OSM way 777",dataset:"osm-2026-07-01",lineage:"边界关系：outside",priority:"低优先",state:"rejected",coarse:false,assessment:["几何：有效","语义：commercial","实体：校外","名称：不适用"],reason:"位于确认的 Campus Boundary 外，已拒绝。",shape:'<polygon points="92,375 165,370 171,435 96,442"/>'}
      ]},
      circulation:{acquisition:"完整 · 24/24 分块",providers:[{name:"OSM",status:"完整",detail:"62 条道路/步道"},{name:"Overture",status:"完整",detail:"41 条 transportation"}],completed:false,gaps:[],candidates:[
        {id:"c-01",name:"中山北路校内段",kind:"道路",source:"OSM way 1002",dataset:"osm-2026-07-01",lineage:"highway=service · width=6m",priority:"普通",state:"accepted",coarse:false,assessment:["几何：中心线完整","分类：车辆道路","实体：连续","宽度：来源明确"],reason:"保留完整来源，Review Geometry 在边界内裁切。",shape:'<path d="M90 330 C230 280 430 350 700 235" fill="none"/>'},
        {id:"c-02",name:"丽娃河步行桥",kind:"道路",source:"OSM way 1882",dataset:"osm-2026-07-01",lineage:"highway=footway · bridge=yes",priority:"普通",state:"supporting",coarse:false,assessment:["几何：有效","分类：步行桥","实体：支持主路径","宽度：规则派生"],reason:"作为主步行网络的支持证据。",shape:'<path d="M300 420 Q380 350 470 420" fill="none"/>'},
        {id:"c-03",name:"东门连接步道",kind:"道路",source:"Overture segment a92",dataset:"overture-2026-06-17.0",lineage:"subtype=pedestrian",priority:"高优先",state:"pending",coarse:false,assessment:["几何：边界处中断","分类：步行道","实体：可能连接东门","宽度：未知"],reason:"需要确认是否作为校内连续路径保留。",shape:'<path d="M520 360 L705 405" fill="none"/>'}
      ]},
      water:{acquisition:"部分 · OSM 24/24，Overture 19/24",providers:[{name:"OSM",status:"完整",detail:"4 条 water records"},{name:"Overture",status:"部分",detail:"东南 5 分块失败"},{name:"Sentinel-2",status:"粗证据",detail:"10m 水体分类"}],completed:false,gaps:[{id:"g-water-se",title:"东南区域水域覆盖不完整",impact:"可能遗漏窄河道；生成将保留为空白",ack:false}],candidates:[
        {id:"w-01",name:"丽娃河主水面",kind:"水域",source:"OSM relation 2201",dataset:"osm-2026-07-01",lineage:"natural=water · multipolygon",priority:"普通",state:"accepted",coarse:false,assessment:["几何：关系完整","分类：河流面","实体：唯一","宽度：来源几何"],reason:"确认主水面并保留孔洞。",shape:'<path d="M0 440 Q160 370 310 430 T760 405 L760 540 L0 540Z"/>'},
        {id:"w-02",name:"西北粗粒度水体迹象",kind:"水域",source:"Sentinel-2 derived candidate",dataset:"sentinel-2-2026-06-20",lineage:"10m 像元 · threshold 0.63",priority:"高优先",state:"pending",coarse:true,assessment:["几何：粗粒度轮廓","分类：可能水体","实体：无结构化匹配","精度：不可作为边界真值"],reason:"只能作为结构化数据缺口证据；接受后仍标记为粗粒度。",shape:'<ellipse cx="185" cy="170" rx="80" ry="42"/>'}
      ]},
      vegetation:{acquisition:"完整 + 粗证据",providers:[{name:"OSM",status:"完整",detail:"9 条 landuse/natural"},{name:"Overture",status:"完整",detail:"6 条 land_use"},{name:"WorldCover",status:"粗证据",detail:"10m tree/grass classes"}],completed:false,gaps:[{id:"g-veg-detail",title:"树木级细节不在 V1.1 覆盖范围",impact:"MC 中由玩家补充单棵树木",ack:true}],candidates:[
        {id:"v-01",name:"丽娃河沿岸绿地",kind:"植被",source:"OSM polygon 552",dataset:"osm-2026-07-01",lineage:"landuse=grass",priority:"普通",state:"accepted",coarse:false,assessment:["几何：有效","分类：草地","实体：唯一","精度：结构化面"],reason:"作为草地区域进入 Reviewed Campus Model。",shape:'<polygon points="110,340 300,310 360,410 150,430"/>'},
        {id:"v-02",name:"北部树冠粗分类",kind:"植被",source:"ESA WorldCover derived",dataset:"worldcover-2021-v200",lineage:"10m tree_cover class",priority:"普通",state:"pending",coarse:true,assessment:["几何：10m 栅格矢量化","分类：tree cover","实体：非单棵树","精度：粗粒度"],reason:"仅用于提示成片树冠，不生成单棵树身份。",shape:'<polygon points="400,90 650,92 690,168 430,188"/>'}
      ]},
      sports:{acquisition:"完整 · 24/24 分块",providers:[{name:"OSM",status:"完整",detail:"5 条 leisure/sport"},{name:"Overture",status:"完整",detail:"3 条 land_use"}],completed:true,gaps:[],candidates:[
        {id:"s-01",name:"田径场容器",kind:"体育设施",source:"OSM relation 810",dataset:"osm-2026-07-01",lineage:"leisure=pitch · sport=athletics",priority:"普通",state:"accepted",coarse:false,assessment:["几何：完整椭圆","分类：田径场","包含：2 个子设施","实体：唯一"],reason:"保留跑道容器及内部球场关系。",shape:'<ellipse cx="505" cy="315" rx="145" ry="92"/>'},
        {id:"s-02",name:"田径场内足球场",kind:"体育设施",source:"OSM way 811",dataset:"osm-2026-07-01",lineage:"sport=soccer · parent=810",priority:"普通",state:"accepted",coarse:false,assessment:["几何：完整矩形","分类：足球场","包含：田径场内部","实体：子设施"],reason:"作为嵌套球场保留，不与田径场合并。",shape:'<rect x="420" y="270" width="170" height="90" rx="4"/>'}
      ]}
    };
    const state={variant:new URLSearchParams(location.search).get("variant")||"A",layer:"building",selected:"b-ecnu-01",batch:new Set(),last:"等待审核候选",history:0};
    if(!variants[state.variant])state.variant="A";
    const root=document.querySelector("#root"),debug=document.querySelector("#debug"),toast=document.querySelector("#toast");
    const activeLayer=()=>layers[state.layer];
    const selectedCandidate=()=>activeLayer().candidates.find(c=>c.id===state.selected)||activeLayer().candidates[0];
    const pendingCount=l=>l.candidates.filter(c=>["pending","conflict"].includes(c.state)).length;
    const unackedCount=l=>l.gaps.filter(g=>!g.ack).length;
    const blockers=l=>pendingCount(l)+unackedCount(l);
    const stateText=s=>({pending:"待审核",conflict:"冲突",accepted:"已接受",rejected:"已拒绝",supporting:"支持证据"}[s]);
    function setLast(text){state.last=text;toast.innerHTML=`<div class="toast">${text}</div>`;clearTimeout(setLast.t);setLast.t=setTimeout(()=>toast.innerHTML="",2200);renderDebug()}
    function layerButtons(compact=false){return layerOrder.map(k=>{const l=layers[k],active=k===state.layer,b=blockers(l);return `<button class="layer-button ${active?"active":""} ${l.completed?"complete":""}" data-action="layer" data-layer="${k}"><span class="layer-icon">${layerIcons[k]}</span><span class="layer-meta"><strong>${layerNames[k]}</strong><span>${l.completed?"✓ 已完成":b?`${b} 项阻塞`:"可完成"}</span></span><span class="count">${pendingCount(l)||""}</span></button>`}).join("")}
    function candidateCards(){return activeLayer().candidates.map(c=>`<div class="candidate-card ${c.id===state.selected?"selected":""}" data-action="candidate" data-id="${c.id}" tabindex="0"><div class="row"><input type="checkbox" data-action="batch-toggle" data-id="${c.id}" ${state.batch.has(c.id)?"checked":""} aria-label="批量选择 ${c.name}"><span class="state-label ${c.state}">${stateText(c.state)}</span><span class="spacer"></span>${c.coarse?'<span class="pill coarse">粗证据</span>':""}<span class="pill ${c.priority==="高优先"?"warn":""}">${c.priority}</span></div><h3>${c.name}</h3><div class="tiny muted">${c.source}</div></div>`).join("")}
    function providers(){return activeLayer().providers.map(p=>`<div class="provider"><span><strong>${p.name}</strong>${p.detail}</span><span class="pill ${p.status==="部分"?"bad":p.status==="粗证据"?"coarse":""}">${p.status}</span></div>`).join("")}
    function gaps(){const l=activeLayer();if(!l.gaps.length)return `<div class="notice good">当前类别没有已知缺口。</div>`;return l.gaps.map(g=>`<div class="gap-card ${g.ack?"ack":""}"><strong>${g.title}</strong><p style="margin:5px 0">${g.impact}</p><button class="small" data-action="gap" data-id="${g.id}">${g.ack?"✓ 已确认缺口":"确认缺口并允许继续"}</button></div>`).join("")}
    function assessment(){const c=selectedCandidate();return `<div class="assessment">${c.assessment.map(x=>{const [a,b]=x.split("：");return `<div><strong>${a}</strong>${b||""}</div>`}).join("")}</div>`}
    function detailActions(){const c=selectedCandidate();return `<div class="action-grid"><button class="primary" data-action="accept">接受</button><button class="danger" data-action="reject">拒绝</button><button class="wide" data-action="batch-current">${state.batch.has(c.id)?"移出批量选择":"加入批量选择"}</button><button class="wide" data-action="revoke" ${["pending","conflict"].includes(c.state)?"disabled":""}>撤销当前决定，返回待审核</button></div>`}
    function detailPanel(){const c=selectedCandidate();return `<div class="stack"><div><div class="eyebrow">候选证据</div><h2>${c.name}</h2><p class="tiny muted">${c.kind} · ${c.id}</p></div><div class="notice ${c.state==="conflict"?"warn":""}">${c.reason}</div>${assessment()}<div class="tiny muted">Source Lineage<br><strong>${c.lineage}</strong></div><div class="tiny muted">Dataset Bundle<br><strong>${c.dataset}</strong></div>${detailActions()}<button data-action="provenance">查看完整来源与派生链</button><div class="no-draw"><strong>没有“绘制地物”按钮</strong><br>缺失或无法判断的现实对象只能记录为 Known Feature Gap，后续在 Minecraft/Axiom 中补充。</div></div>`}
    function mapSvg(){const l=activeLayer();return `<div class="map"><svg viewBox="0 0 760 540" aria-label="Foundation Feature Review Map"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" class="map-grid"/></pattern></defs><rect width="760" height="540" fill="url(#g)"/><path class="water-bg" d="M0 450 Q150 390 300 440 T760 410 L760 540 L0 540Z"/><path class="road-bg" d="M-20 320 C180 260 410 350 780 215"/><g>${[[215,185,55,34],[340,165,80,45],[495,205,68,40],[270,330,85,50],[450,350,100,55]].map(b=>`<rect class="building-bg" x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" rx="3"/>`).join("")}</g><text class="map-label" x="330" y="270">华东师范大学普陀校区</text>${l.candidates.map(c=>`<g class="feat ${c.state} ${c.id===state.selected?"selected":""} ${c.coarse?"coarse":""}" data-action="candidate" data-id="${c.id}">${c.shape}</g>`).join("")}</svg><div class="map-badge">${layerNames[state.layer]} · ${l.acquisition}</div><div class="legend"><span><i class="dot pending"></i> 待审核</span><span><i class="dot accepted"></i> 已接受</span><span><i class="dot rejected"></i> 已拒绝</span><span><i class="dot conflict"></i> 冲突</span></div></div>`}
    function batchBar(){return `<div class="row"><strong>批量操作</strong><span class="tiny muted">已选 ${state.batch.size}</span><button class="small" data-action="batch-accept" ${!state.batch.size?"disabled":""}>批量接受</button><button class="small danger" data-action="batch-reject" ${!state.batch.size?"disabled":""}>批量拒绝</button></div>`}
    function completeButton(){const l=activeLayer(),b=blockers(l);return `<button class="primary" data-action="complete" ${b||l.completed?"disabled":""}>${l.completed?"✓ 本层审核已完成":b?`还有 ${b} 项阻塞`:"完成本层审核"}</button>`}
    function variantA(){const l=activeLayer();return `<main class="a-shell"><aside class="a-layers"><div class="eyebrow">五类独立完成</div><h2>Foundation Review</h2><p class="tiny muted">按层审核，完成状态与缺口分别保存。</p><div class="stack">${layerButtons()}</div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="eyebrow">来源状态</div><div class="stack" style="margin-top:8px">${providers()}</div></aside><section class="a-center"><div class="a-maphead"><div class="row"><div><div class="eyebrow">${layerNames[state.layer]}候选 · ${l.candidates.length}</div><strong>${l.acquisition}</strong></div><div class="spacer"></div>${batchBar()}</div></div>${mapSvg()}<div class="a-complete"><span class="tiny"><strong>${layerNames[state.layer]}审核</strong><br>${blockers(l)?`先处理 ${pendingCount(l)} 个候选并确认 ${unackedCount(l)} 个缺口。`:"当前证据均有处置，可明确完成。"}</span><button data-action="gaps">查看缺口</button>${completeButton()}</div></section><aside class="a-detail">${detailPanel()}<hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="eyebrow">Known Feature Gaps</div><div class="stack" style="margin-top:8px">${gaps()}</div></aside></main>`}
    function variantB(){const l=activeLayer(),done=layerOrder.filter(k=>layers[k].completed).length;return `<main class="b-shell"><div class="row"><div><div class="eyebrow">队列式审核</div><h1>处理 Foundation 待办</h1></div><div class="spacer"></div><span class="pill info">${done}/5 层完成</span></div><div class="b-layer-tabs">${layerOrder.map(k=>`<button class="small ${k===state.layer?"active":""}" data-action="layer" data-layer="${k}">${layerIcons[k]} ${layerNames[k]} · ${pendingCount(layers[k])}</button>`).join("")}</div><div class="b-grid"><aside class="b-queue card"><div class="queue-toolbar">${batchBar()}</div><div class="stack">${candidateCards()}</div></aside><section class="b-map card">${mapSvg()}</section><aside class="b-decision card">${detailPanel()}<hr style="border:0;border-top:1px solid var(--line);margin:13px 0"><div class="eyebrow">缺口与来源</div><div class="stack" style="margin-top:8px">${gaps()}${providers()}</div></aside></div><div class="b-bottom"><span class="tiny"><strong>${layerNames[state.layer]}</strong> · ${blockers(l)?`${blockers(l)} 项阻塞完成`:"可以完成本层"}</span><div class="progress"><span style="width:${done/5*100}%"></span></div><button data-action="gaps">缺口</button>${completeButton()}</div></main>`}
    function variantC(){const l=activeLayer(),c=selectedCandidate(),n=state.batch.size;return `<main class="c-shell">${mapSvg()}<section class="c-layers"><div class="eyebrow" style="margin:2px 4px 8px">地图优先 · 五层</div><div class="stack" style="gap:6px">${layerButtons(true)}</div></section><aside class="c-gaps"><div class="row"><div><div class="eyebrow">缺口与覆盖</div><strong>${layerNames[state.layer]}</strong></div><div class="spacer"></div><span class="pill ${l.acquisition.includes("部分")?"bad":""}">${l.acquisition}</span></div><div class="stack" style="margin-top:10px">${gaps()}${providers()}</div><div class="no-draw" style="margin-top:10px">地图只用于选择和查看候选，不进入绘制模式。</div></aside><section class="c-sheet"><div class="c-sheet-grid"><div><div class="row"><span class="state-label ${c.state}">${stateText(c.state)}</span>${c.coarse?'<span class="pill coarse">粗证据</span>':""}<span class="pill ${c.priority==="高优先"?"warn":""}">${c.priority}</span></div><h2 style="margin:7px 0 4px">${c.name}</h2><div class="tiny muted">${c.source} · ${c.lineage}</div><p class="tiny" style="margin:8px 0 0">${c.reason}</p></div><div class="c-actions"><button data-action="batch-current">${state.batch.has(c.id)?"移出批量":"加入批量"}</button><button data-action="batch-reject" ${n?"":"disabled"}>批量拒绝 ${n||""}</button><button data-action="batch-accept" ${n?"":"disabled"}>批量接受 ${n||""}</button><button data-action="revoke" ${["pending","conflict"].includes(c.state)?"disabled":""}>撤销</button><button class="danger" data-action="reject">拒绝</button><button class="primary" data-action="accept">接受</button>${completeButton()}</div></div></section></main>`}
    function switcher(){return `<div class="switcher"><button data-action="prev">←</button><span><strong>${state.variant}</strong> — ${variants[state.variant]}</span><button data-action="next">→</button></div>`}
    function renderDebug(){const l=activeLayer();debug.textContent=`PROTOTYPE STATE\nvariant=${state.variant} layer=${state.layer}\nselected=${state.selected} batch=${[...state.batch].join(",")||"none"}\npending=${pendingCount(l)} gaps=${l.gaps.length} unacked=${unackedCount(l)}\ncompleted=${l.completed} history=${state.history}\nlast=${state.last}`}
    function render(){root.innerHTML=(state.variant==="A"?variantA():state.variant==="B"?variantB():variantC())+switcher();renderDebug()}
    function cycle(d){const keys=Object.keys(variants),i=keys.indexOf(state.variant);state.variant=keys[(i+d+keys.length)%keys.length];const u=new URL(location.href);u.searchParams.set("variant",state.variant);history.replaceState({},"",u);state.last=`切换到方案 ${state.variant}`;render()}
    function chooseLayer(k){state.layer=k;state.selected=layers[k].candidates[0]?.id||null;state.batch.clear();state.last=`切换到${layerNames[k]}审核`;render()}
    function setDecision(next){const c=selectedCandidate();if(!c)return;if(c.state===next)return setLast("当前决定未变化");const wasComplete=activeLayer().completed;c.state=next;state.history++;if(wasComplete){activeLayer().completed=false;state.last=`修改 ${c.name}，已重新打开${layerNames[state.layer]}审核`}else state.last=`${c.name} → ${stateText(next)}`;render()}
    function batchDecision(next){const ids=[...state.batch],l=activeLayer();if(!ids.length)return;const targets=l.candidates.filter(c=>ids.includes(c.id));if(targets.length!==ids.length)return setLast("批量预检失败：选择已变化，未写入任何决定");targets.forEach(c=>c.state=next);l.completed=false;state.batch.clear();state.history++;state.last=`原子批量${next==="accepted"?"接受":"拒绝"} ${targets.length} 个候选`;render()}
    document.addEventListener("click",e=>{const t=e.target.closest("[data-action]");if(!t)return;const a=t.dataset.action;if(a==="prev")return cycle(-1);if(a==="next")return cycle(1);if(a==="layer")return chooseLayer(t.dataset.layer);if(a==="candidate"){state.selected=t.dataset.id;state.last=`选择候选 ${selectedCandidate().name}`;return render()}if(a==="batch-toggle"){e.stopPropagation();t.checked?state.batch.add(t.dataset.id):state.batch.delete(t.dataset.id);state.last=`批量选择 ${state.batch.size} 项`;return render()}if(a==="batch-current"){const id=selectedCandidate().id;state.batch.has(id)?state.batch.delete(id):state.batch.add(id);state.last=`批量选择 ${state.batch.size} 项`;return render()}if(a==="accept")return setDecision("accepted");if(a==="reject")return setDecision("rejected");if(a==="revoke")return setDecision("pending");if(a==="batch-accept")return batchDecision("accepted");if(a==="batch-reject")return batchDecision("rejected");if(a==="gap"){const g=activeLayer().gaps.find(x=>x.id===t.dataset.id);g.ack=!g.ack;activeLayer().completed=false;state.history++;state.last=g.ack?`已确认缺口：${g.title}`:`重新打开缺口：${g.title}`;return render()}if(a==="complete"){const l=activeLayer(),b=blockers(l);if(b)return setLast(`仍有 ${b} 项阻塞，不能完成本层`);if(l.completed)return setLast(`${layerNames[state.layer]}审核已经完成`);l.completed=true;state.history++;state.last=`已明确完成${layerNames[state.layer]}审核`;return render()}if(a==="provenance")return setLast("打开完整 Source Lineage、Dataset Bundle 与派生链（原型未展开）");if(a==="gaps")return setLast(activeLayer().gaps.length?`当前 ${activeLayer().gaps.length} 个 Known Feature Gap`:`${layerNames[state.layer]}没有已知缺口`)});
    document.addEventListener("keydown",e=>{const editing=["INPUT","TEXTAREA"].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable;if(!editing&&e.key==="ArrowLeft")cycle(-1);if(!editing&&e.key==="ArrowRight")cycle(1)});
    render();
  </script>
</body>
</html>
