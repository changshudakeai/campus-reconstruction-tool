<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>First-run Guidance Prototype</title>
  <style>
    :root{--ink:#18241f;--muted:#68736d;--paper:#f6f1e5;--panel:#fffdf7;--line:#d9d2c3;--green:#1f5b46;--green2:#dfece4;--amber:#bd7720;--amber2:#fff0d2;--red:#a84b3f;--blue:#dcecf1;--shadow:0 12px 32px rgba(24,36,31,.14)}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.35 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}button,input{font:inherit}button{color:inherit;border:1px solid var(--line);background:#fffdf7;border-radius:8px;padding:8px 12px;cursor:pointer}button:hover:not(:disabled){border-color:var(--green);background:#f4faf6}button:disabled{opacity:.48;cursor:not-allowed}.primary{background:var(--green);border-color:var(--green);color:white}.danger{color:var(--red);border-color:#dec1bb}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}.tiny{font-size:12px}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center}.stack{display:flex;flex-direction:column;gap:10px}.spacer{flex:1}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#ede9df;font-size:11px;font-weight:650}.pill.good{background:var(--green2);color:var(--green)}.pill.warn{background:var(--amber2);color:#87520e}.pill.bad{background:#f6dfdc;color:var(--red)}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.banner{height:26px;background:#10271f;color:#f7f3e9;text-align:center;font-size:11px;letter-spacing:.04em;padding:5px}.appbar{height:68px;background:#f7f0e1;border-bottom:1px solid #243a31;display:flex;align-items:center;padding:0 22px;gap:16px}.brand{font-size:21px;font-weight:800;padding-right:16px;border-right:1px solid var(--line)}.crumb{color:var(--muted)}.help{width:34px;height:34px;border-radius:50%;padding:0;font-weight:800}.switcher{position:fixed;z-index:90;left:50%;bottom:14px;transform:translateX(-50%);height:48px;min-width:350px;padding:6px;background:#10271f;color:white;border-radius:26px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;box-shadow:0 9px 24px rgba(0,0,0,.24)}.switcher button{height:36px;width:36px;border-radius:50%;background:#24483b;color:white;border:0;padding:0}.switch-label{text-align:center}.debug{position:fixed;left:10px;bottom:10px;z-index:95;width:330px;background:rgba(255,255,255,.92);border:1px dashed #999;padding:7px;font:10px/1.3 Consolas,monospace;color:#555}
    .campus-shell{height:calc(100vh - 94px);padding:18px 22px 82px;display:grid;grid-template-columns:1fr 360px;gap:16px}.campus-main{min-width:0}.campus-head{display:flex;align-items:flex-end;margin-bottom:14px}.campus-head h1{margin:2px 0 0;font-size:26px}.searchbox{display:flex;gap:8px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.searchbox input{flex:1;border:0;background:transparent;outline:none;color:var(--ink);padding:4px}.map{height:calc(100% - 114px);min-height:340px;position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#e5e6db}.map svg{width:100%;height:100%;display:block}.map-card{position:absolute;left:22px;top:22px;width:270px;padding:13px;background:rgba(255,253,247,.97);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}.map-tip{position:absolute;right:14px;top:14px;background:#17392e;color:#fff;padding:7px 10px;border-radius:16px;font-size:11px}.side{padding:16px;overflow:auto}.project-row{padding:11px;border:1px solid var(--line);border-radius:9px;background:#faf7ee}.journey{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.journey-step{padding:8px 5px;text-align:center;background:#f0ece2;border-radius:8px;font-size:11px}.journey-step strong{display:block;font-size:16px;color:var(--green)}.callout{padding:10px 12px;border-left:4px solid var(--amber);background:var(--amber2);border-radius:6px}.shot{height:88px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(135deg,#dfe8df,#f4ead5);position:relative;overflow:hidden;padding:10px}.shot:after{content:"";position:absolute;width:58%;height:44%;right:8px;bottom:8px;border:2px solid rgba(31,91,70,.45);border-radius:6px}.shot strong{font-size:12px}.toast{position:fixed;z-index:120;left:50%;bottom:78px;transform:translateX(-50%);min-width:420px;max-width:650px;background:#172b23;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);display:none}.toast.show{display:flex}.toast.warn{background:#674816}
    .tour-mask{position:fixed;z-index:40;inset:94px 0 0;background:rgba(13,25,20,.52)}.tour-hole{position:fixed;z-index:42;border:3px solid #f5cf76;border-radius:13px;box-shadow:0 0 0 6px rgba(245,207,118,.2);pointer-events:none}.tour-card{position:fixed;z-index:45;width:360px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.tour-card h2{margin:5px 0 7px}.progress-dots{display:flex;gap:6px}.progress-dots i{width:18px;height:4px;background:#d8d1c3;border-radius:3px}.progress-dots i.active{background:var(--green)}.key-hint{display:inline-block;padding:3px 7px;border:1px solid #bbb3a4;border-bottom-width:2px;border-radius:5px;background:#fff;font:11px Consolas,monospace}
    .check-panel{padding:16px;overflow:auto}.check-item{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:start;padding:11px 4px;border-bottom:1px solid var(--line)}.check-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#e7e1d5;font-weight:800}.check-item.active .check-num{background:var(--green);color:white}.check-item.done .check-num{background:var(--green2);color:var(--green)}.context-tip{position:absolute;z-index:5;left:306px;top:104px;width:280px;padding:10px 12px;background:#fff8e8;border:1px solid #dfbc75;border-radius:10px;box-shadow:var(--shadow)}.context-tip:before{content:"";position:absolute;left:-8px;top:22px;width:14px;height:14px;background:#fff8e8;border-left:1px solid #dfbc75;border-bottom:1px solid #dfbc75;transform:rotate(45deg)}
    .quick-shell{height:calc(100vh - 94px);padding:16px 22px 82px;overflow:auto}.quick-hero{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 420px;gap:18px}.quick-copy{padding:24px}.quick-copy h1{font-size:33px;line-height:1.15;margin:6px 0 10px}.quick-visual{padding:14px}.quick-journey{max-width:1180px;margin:14px auto;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.quick-stage{padding:14px;min-height:142px}.quick-stage .num{font-size:28px;font-weight:850;color:var(--green)}.quick-bottom{max-width:1180px;margin:14px auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:20px}.shortcut-strip{display:flex;gap:8px;flex-wrap:wrap}
    .settings-mask{position:fixed;z-index:100;inset:0;background:rgba(10,20,16,.45)}.settings{position:fixed;z-index:105;right:0;top:0;bottom:0;width:min(820px,88vw);background:var(--panel);box-shadow:-12px 0 42px rgba(0,0,0,.2);display:grid;grid-template-columns:180px 1fr}.settings-nav{padding:22px 14px;background:#f3eee2;border-right:1px solid var(--line)}.settings-nav button{width:100%;text-align:left;margin:3px 0}.settings-nav button.active{background:var(--green);color:white;border-color:var(--green)}.settings-main{padding:22px;overflow:auto}.settings-head{display:flex;align-items:start;margin-bottom:16px}.context-bar{display:flex;gap:7px;flex-wrap:wrap;padding:10px;background:#f2eee5;border-radius:10px}.context-bar button.active{background:#dfece4;border-color:#8cb2a0}.shortcut-table{width:100%;border-collapse:collapse;margin-top:12px}.shortcut-table th,.shortcut-table td{text-align:left;padding:10px 8px;border-bottom:1px solid #e5ded1;vertical-align:top}.shortcut-table th{font-size:11px;color:var(--muted)}.shortcut-table td:nth-child(2){font-family:Consolas,monospace;white-space:nowrap}.availability{display:flex;gap:7px;align-items:flex-start}.availability i{width:9px;height:9px;border-radius:50%;margin-top:4px;background:var(--green)}.availability.off i{background:var(--red)}.availability span{font-size:11px}.test-keys{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.settings-callout{padding:11px;background:var(--blue);border-radius:9px}.recovery-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.recovery-card{padding:12px;border:1px solid var(--line);border-radius:9px;background:#faf7ee}
    @media(max-width:1000px){.campus-shell{grid-template-columns:1fr}.side,.check-panel{display:none}.quick-hero{grid-template-columns:1fr}.quick-visual{display:none}.quick-journey{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <div class="banner">THROWAWAY PROTOTYPE · 引导状态只保存在内存 · 不修改真实设置 · 快捷键仅用于演示冲突反馈</div>
  <header class="appbar">
    <div class="brand">MC 校园复刻</div>
    <div class="crumb">校区与项目</div>
    <div class="spacer"></div>
    <span class="pill good">● 原子自动保存正常</span>
    <button class="help" data-action="reopen" aria-label="重新打开新手引导">?</button>
    <button data-action="settings">设置</button>
  </header>
  <div id="app"></div>
  <div id="overlay"></div>
  <div class="toast" id="toast"><span id="toastText"></span><span class="spacer"></span><button data-action="dismiss-toast">知道了</button></div>
  <div class="switcher">
    <button data-action="prev" aria-label="上一个方案">←</button>
    <div class="switch-label"><strong id="variantLabel">A</strong> — <span id="variantName">分步聚焦引导</span></div>
    <button data-action="next" aria-label="下一个方案">→</button>
  </div>
  <div class="debug" id="debug"></div>
  <script>
    const names={A:"分步聚焦引导",B:"任务清单＋就地提示",C:"一页式快速开始"};
    const state={variant:new URLSearchParams(location.search).get("variant")||"A",tour:true,step:1,settings:false,settingsTab:"shortcuts",context:"campus",textFocus:false,modal:false,mapTool:"none",vertex:false,history:0,toast:"",toastWarn:false,last:"首次运行引导已打开"};
    const tourSteps=[
      {title:"先确认复刻校区",body:"所有项目都归属于一个 Campus Target。先搜索并确认校区，再新建、导入或打开该校区下的项目。",target:{x:22,y:164,w:820,h:70},card:{x:530,y:255},hint:"搜索框"},
      {title:"然后选择校区下的项目",body:"同一校区可以有多个项目，但不能同名。重新打开已有项目时，会直接恢复到最早未完成任务。",target:{x:868,y:112,w:370,h:330},card:{x:500,y:230},hint:"项目列表"},
      {title:"自动保存、恢复与历史",body:"更改会原子自动保存。异常退出后由你选择恢复副本或上次确认保存；撤销和重做只作用于当前允许的语义操作。",target:{x:1015,y:40,w:218,h:38},card:{x:630,y:160},hint:"保存状态"},
      {title:"完整路线只需记住五步",body:"Campus Target → Project → Foundation → Detailed → Axiom。点击下面的截图速览可随时重新查看。",target:{x:878,y:454,w:350,h:150},card:{x:500,y:215},hint:"截图速览"},
      {title:"快捷键会根据上下文启用",body:"设置页列出所有快捷键，但不要求你先打开设置：不可用时会在原位置解释原因。按 F1 可随时重新打开本引导。",target:{x:1160,y:38,w:78,h:42},card:{x:650,y:180},hint:"设置与 F1"}
    ];
    const shortcuts=[
      {action:"在当前校区新建项目",keys:"Ctrl+N",rule:"project",ok:"在已确认 Campus Target 下新建项目",off:"请先确认 Campus Target"},
      {action:"导入便携项目",keys:"Ctrl+O",rule:"project",ok:"导入并先保存文件内已有 Campus Target",off:"请先确认 Campus Target"},
      {action:"保存当前项目",keys:"Ctrl+S",rule:"project",ok:"保存当前语义修订",off:"尚未选择项目"},
      {action:"导出便携项目副本",keys:"Ctrl+Shift+S",rule:"project",ok:"导出副本，不改变当前项目位置",off:"尚未选择项目"},
      {action:"撤销",keys:"Ctrl+Z",rule:"undo",ok:"撤销最近一次语义操作",off:"当前阶段没有可撤销操作"},
      {action:"重做",keys:"Ctrl+Y / Ctrl+Shift+Z",rule:"redo",ok:"重做最近撤销的语义操作",off:"当前阶段没有可重做操作"},
      {action:"删除所选顶点",keys:"Delete",rule:"vertex",ok:"删除当前明确选中的边界顶点",off:"只有在边界调整模式且已选中顶点时可用"},
      {action:"确认当前任务",keys:"Ctrl+Enter",rule:"confirm",ok:"确认当前无阻塞任务",off:"当前任务仍有阻塞或焦点位于文本输入"},
      {action:"取消当前工具／关闭窗口",keys:"Esc",rule:"escape",ok:"按优先级关闭模态窗口或取消地图工具",off:"当前没有可取消的工具或窗口"},
      {action:"重新打开新手引导",keys:"F1",rule:"always",ok:"打开首次运行引导",off:""}
    ];
    function available(s){if(s.rule==="always")return[true,s.ok];if(s.rule==="project")return[state.context!=="campus",state.context!=="campus"?s.ok:s.off];if(s.rule==="undo")return[state.history>0&&!state.textFocus&&!state.modal,state.textFocus?"正在输入文字，Ctrl+Z 留给文本编辑":state.modal?"模态窗口打开时不修改项目历史":state.history? s.ok:s.off];if(s.rule==="redo")return[false,state.textFocus?"正在输入文字，重做作用于文本编辑":s.off];if(s.rule==="vertex")return[state.context==="boundary"&&state.mapTool==="adjust"&&state.vertex,state.context!=="boundary"?"当前不在 Campus Boundary 调整阶段":state.mapTool!=="adjust"?"尚未进入边界调整模式":!state.vertex?"请先选择一个顶点":s.ok];if(s.rule==="confirm")return[!state.textFocus&&!state.modal&&state.context!=="campus",state.textFocus?"正在输入文字，避免与提交文本冲突":state.modal?"请先处理当前模态窗口":state.context==="campus"?"请先确认 Campus Target":s.ok];if(s.rule==="escape")return[state.modal||state.mapTool!=="none",state.modal?"关闭当前模态窗口":state.mapTool!=="none"?"取消当前地图工具":s.off];return[false,s.off]}
    function baseMap(){return `<div class="map"><svg viewBox="0 0 820 500" role="img" aria-label="校区搜索地图"><defs><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#d0d2c8"/></pattern></defs><rect width="820" height="500" fill="#e8e9de"/><rect width="820" height="500" fill="url(#grid)"/><path d="M-10 350 C150 300 300 365 450 320 S690 270 840 300" fill="none" stroke="white" stroke-width="20"/><path d="M238 112 L637 80 L708 393 L210 432 Z" fill="#dfe9df" fill-opacity=".45" stroke="#2c6651" stroke-width="5"/><g fill="#c9bda4" stroke="#a99d86"><rect x="290" y="155" width="100" height="72" rx="5"/><rect x="432" y="130" width="124" height="78" rx="5"/><rect x="535" y="272" width="118" height="72" rx="5"/><rect x="310" y="315" width="92" height="55" rx="5"/></g><text x="354" y="455" fill="#56645e">华东师范大学普陀校区</text></svg><div class="map-tip">地图仅用于确认 Campus Target</div><div class="map-card"><div class="eyebrow">搜索结果</div><h3 style="margin:5px 0">华东师范大学普陀校区</h3><div class="tiny muted">上海市普陀区 · 高德 POI</div><div class="row" style="margin-top:10px"><span class="pill good">候选匹配</span><span class="spacer"></span><button class="primary" data-action="confirm-campus">确认该校区</button></div></div></div>`}
    function journey(){return `<div class="journey">${[["1","校区"],["2","项目"],["3","Foundation"],["4","Detailed"],["5","Axiom"]].map(x=>`<div class="journey-step"><strong>${x[0]}</strong>${x[1]}</div>`).join("")}</div>`}
    function screenshotQuick(){return `<div class="stack"><div class="shot"><strong>① 确认 Campus Target</strong><div class="tiny muted">先校区，后项目</div></div><div class="shot"><strong>② Foundation → Detailed</strong><div class="tiny muted">审核基础地物，再生成细节</div></div><div class="shot"><strong>③ Axiom 完善并导出 .schem</strong><div class="tiny muted">固定 Minecraft 26.1.2</div></div></div>`}
    function sideProjects(extra=""){return `<aside class="side card"><div class="row"><div><div class="eyebrow">校区下的项目</div><h2 style="margin:4px 0">选择项目</h2></div><span class="spacer"></span><button disabled>新建项目</button></div><div class="callout tiny" style="margin:8px 0">先确认 Campus Target，随后才会显示该校区的本地项目。</div><div class="stack"><div class="project-row"><strong>普陀校区主复刻</strong><div class="tiny muted">下一步：审核水域 · 17:28 保存</div></div><div class="project-row"><strong>历史建筑练习</strong><div class="tiny muted">下一步：确认 Campus Boundary · 昨天</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="eyebrow">流程速览</div>${journey()}${extra}</aside>`}
    function campusMain(side){return `<main class="campus-shell"><section class="campus-main"><div class="campus-head"><div><div class="eyebrow">第 1 步</div><h1>选择要复刻的校区</h1><div class="tiny muted">确认 Campus Target 后，才选择或创建其下的项目。</div></div></div><div class="searchbox"><input value="华东师范大学普陀校区" aria-label="搜索高校或校区"><button class="primary">搜索</button></div>${baseMap()}</section>${side}</main>`}
    function tourOverlay(){if(!state.tour||state.variant!=="A")return"";const s=tourSteps[state.step-1],dots=tourSteps.map((_,i)=>`<i class="${i===state.step-1?"active":""}"></i>`).join("");return `<div class="tour-mask"></div><div class="tour-hole" style="left:${s.target.x}px;top:${s.target.y}px;width:${s.target.w}px;height:${s.target.h}px"></div><section class="tour-card" style="left:${s.card.x}px;top:${s.card.y}px"><div class="row"><div class="eyebrow">首次运行 · ${state.step}/5</div><span class="spacer"></span><span class="pill">${s.hint}</span></div><h2>${s.title}</h2><p>${s.body}</p>${state.step===4?`<div class="shot"><strong>截图速览</strong><div class="tiny muted">点击后可查看三张离线内置截图，不依赖网络。</div></div>`:""}<div class="row" style="margin-top:13px"><div class="progress-dots">${dots}</div><span class="spacer"></span><button data-action="skip-tour">跳过</button><button data-action="tour-back" ${state.step===1?"disabled":""}>上一步</button><button class="primary" data-action="${state.step===5?"finish-tour":"tour-next"}">${state.step===5?"完成引导":"下一步"}</button></div></section>`}
    function variantA(){return campusMain(sideProjects(`<div class="tiny muted" style="margin-top:10px">按 <span class="key-hint">F1</span> 随时重新打开引导。</div>`))}
    function checklist(){const items=[["确认 Campus Target","搜索并确认复刻校区"],["选择或创建项目","项目归属于当前校区"],["认识保存与恢复","原子保存、恢复副本和项目历史"],["查看截图速览","Foundation、Detailed 与 Axiom"],["试用上下文快捷键","不可用时就地解释原因"]];return `<aside class="check-panel card"><div class="row"><div><div class="eyebrow">首次运行清单</div><h2 style="margin:4px 0">完成 0/5</h2></div><span class="spacer"></span><button data-action="skip-tour">暂时收起</button></div><p class="tiny muted">不阻挡操作；完成项会自动勾选，也可从 ? 或设置重新打开。</p>${items.map((x,i)=>`<div class="check-item ${i===0?"active":""}"><span class="check-num">${i+1}</span><span><strong>${x[0]}</strong><span class="tiny muted" style="display:block">${x[1]}</span></span>${i===3?'<button data-action="quickshots">查看</button>':i===4?'<button data-action="settings">试用</button>':""}</div>`).join("")}<div class="callout tiny" style="margin-top:12px">Windows 快捷键会在相关操作第一次可用时出现一次轻提示，不必先去设置页查找。</div></aside>`}
    function variantB(){return `${campusMain(checklist())}<div class="context-tip"><div class="eyebrow">就地提示 · 首次可用</div><strong>确认校区后按 Ctrl+N 新建项目</strong><div class="tiny muted">若快捷键在当前阶段不可用，提示会直接说明原因。</div><button data-action="dismiss-tip" style="margin-top:7px">知道了</button></div>`}
    function variantC(){return `<main class="quick-shell"><section class="quick-hero"><div class="quick-copy card"><div class="eyebrow">首次运行 · 可跳过，可重开</div><h1>从一个校区开始，最后得到一份 .schem</h1><p class="muted">V1.1 的路线固定而清晰：先确认 Campus Target，再选择项目；完成 Foundation 和 Detailed 后，在 Axiom 中补充细节并导出。</p><div class="row"><button class="primary" data-action="start-campus">开始选择校区</button><button data-action="skip-tour">跳过快速开始</button><span class="tiny muted">以后按 F1 或点击 ? 重新打开</span></div></div><div class="quick-visual card"><div class="eyebrow">三张截图看懂流程</div><h2 style="margin:4px 0 10px">截图快速开始</h2>${screenshotQuick()}</div></section><section class="quick-journey">${[["1","确认校区","高德搜索只负责找到 Campus Target。"],["2","选择项目","同一校区可有多个不同名项目。"],["3","Foundation","审核五类基础地物和缺口。"],["4","Detailed","生成并预览 MC 26.1.2 方块。"],["5","Axiom","补充细节，导出 Sponge .schem。"]].map(x=>`<div class="quick-stage card"><div class="num">${x[0]}</div><strong>${x[1]}</strong><p class="tiny muted">${x[2]}</p></div>`).join("")}</section><section class="quick-bottom"><div class="card" style="padding:15px"><div class="eyebrow">保存与恢复</div><h2 style="margin:4px 0">软件会保存什么？</h2><div class="recovery-grid"><div class="recovery-card"><strong>原子自动保存</strong><div class="tiny muted">完整语义修订成功后才替换确认保存。</div></div><div class="recovery-card"><strong>恢复副本</strong><div class="tiny muted">异常退出后由你选择恢复或返回确认保存。</div></div></div></div><div class="card" style="padding:15px"><div class="row"><div><div class="eyebrow">Windows 快捷键</div><h2 style="margin:4px 0">只在适合的上下文生效</h2></div><span class="spacer"></span><button data-action="settings">查看并试用</button></div><div class="shortcut-strip"><span class="pill">Ctrl+S 保存</span><span class="pill">Ctrl+Z 撤销</span><span class="pill">Ctrl+Y 重做</span><span class="pill">F1 引导</span><span class="pill">Esc 取消</span></div></div></section></main>`}
    function shortcutRows(){return shortcuts.map(s=>{const a=available(s);return `<tr><td><strong>${s.action}</strong></td><td>${s.keys}</td><td><div class="availability ${a[0]?"":"off"}"><i></i><span><strong>${a[0]?"当前可用":"当前不可用"}</strong><br>${a[1]}</span></div></td></tr>`}).join("")}
    function settingsContent(){if(state.settingsTab==="general")return `<div class="settings-head"><div><div class="eyebrow">设置</div><h1 style="margin:4px 0">常规与引导</h1></div></div><div class="stack"><div class="settings-callout"><strong>首次运行引导</strong><div class="tiny">已经完成或跳过。可随时重新打开，不会重置项目。</div><button data-action="reopen" style="margin-top:8px">重新打开新手引导</button></div><div class="recovery-card"><strong>截图快速开始</strong><div class="tiny muted">三张内置截图；即使网络不可用也能查看说明。</div><button data-action="quickshots" style="margin-top:8px">查看截图速览</button></div></div>`;if(state.settingsTab==="recovery")return `<div class="settings-head"><div><div class="eyebrow">设置</div><h1 style="margin:4px 0">保存、恢复与历史</h1></div></div><div class="recovery-grid"><div class="recovery-card"><strong>原子自动保存</strong><p class="tiny">只在完整语义操作写入成功后更新确认保存；保存失败不会留下半个项目。</p><span class="pill good">当前正常</span></div><div class="recovery-card"><strong>项目恢复状态</strong><p class="tiny">异常退出后显示时间、来源和差异，由用户选择恢复或放弃。</p><span class="pill">没有待处理恢复副本</span></div><div class="recovery-card"><strong>撤销与重做</strong><p class="tiny">最多 50 个持久化语义操作；文本输入使用控件自己的历史。</p></div><div class="recovery-card"><strong>便携项目副本</strong><p class="tiny">导出副本不会改变当前项目身份或保存位置。</p></div></div>`;return `<div class="settings-head"><div><div class="eyebrow">设置</div><h1 style="margin:4px 0">快捷键与当前可用性</h1><div class="muted">固定 Windows 快捷键；V1.1 不允许自定义。状态会随焦点、模态窗口和地图工具即时变化。</div></div></div><div class="context-bar"><strong>模拟当前阶段：</strong>${[["campus","校区选择"],["project","项目库"],["boundary","边界调整"],["review","Foundation 审核"]].map(x=>`<button class="${state.context===x[0]?"active":""}" data-action="context" data-context="${x[0]}">${x[1]}</button>`).join("")}<button class="${state.textFocus?"active":""}" data-action="toggle-text">文字输入焦点</button><button class="${state.modal?"active":""}" data-action="toggle-modal">模态窗口</button>${state.context==="boundary"?`<button class="${state.mapTool==="adjust"?"active":""}" data-action="toggle-tool">调整模式</button><button class="${state.vertex?"active":""}" data-action="toggle-vertex">已选顶点</button>`:""}</div><div class="test-keys"><strong>试按：</strong><button data-action="test-key" data-key="Ctrl+S">Ctrl+S</button><button data-action="test-key" data-key="Ctrl+Z">Ctrl+Z</button><button data-action="test-key" data-key="Delete">Delete</button><button data-action="test-key" data-key="Ctrl+Enter">Ctrl+Enter</button><button data-action="test-key" data-key="Esc">Esc</button></div><table class="shortcut-table"><thead><tr><th>操作</th><th>快捷键</th><th>当前状态与原因</th></tr></thead><tbody>${shortcutRows()}</tbody></table>`}
    function settingsOverlay(){if(!state.settings)return"";return `<div class="settings-mask" data-action="close-settings"></div><section class="settings"><nav class="settings-nav"><div class="eyebrow">MC 校园复刻</div><h2 style="margin:4px 0 16px">设置</h2><button class="${state.settingsTab==="general"?"active":""}" data-action="settings-tab" data-tab="general">常规与引导</button><button class="${state.settingsTab==="recovery"?"active":""}" data-action="settings-tab" data-tab="recovery">保存与恢复</button><button class="${state.settingsTab==="shortcuts"?"active":""}" data-action="settings-tab" data-tab="shortcuts">快捷键</button><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><button data-action="close-settings">关闭设置</button></nav><div class="settings-main">${settingsContent()}</div></section>`}
    function showToast(text,warn=true){state.toast=text;state.toastWarn=warn;render()}
    function testKey(key){const map={"Ctrl+S":"保存当前项目","Ctrl+Z":"撤销","Delete":"删除所选顶点","Ctrl+Enter":"确认当前任务","Esc":"取消当前工具／关闭窗口"};const s=shortcuts.find(x=>x.action===map[key]);const a=available(s);showToast(a[0]?`${key}：${a[1]}`:`${key} 当前不可用：${a[1]}`,!a[0])}
    function render(){document.getElementById("app").innerHTML=state.variant==="A"?variantA():state.variant==="B"?variantB():variantC();document.getElementById("overlay").innerHTML=tourOverlay()+settingsOverlay();document.getElementById("variantLabel").textContent=state.variant;document.getElementById("variantName").textContent=names[state.variant];const toast=document.getElementById("toast");toast.className=`toast ${state.toast?"show":""} ${state.toastWarn?"warn":""}`;document.getElementById("toastText").textContent=state.toast;document.getElementById("debug").textContent=`PROTOTYPE STATE variant=${state.variant} tour=${state.tour} step=${state.step} settings=${state.settingsTab}:${state.settings} context=${state.context} text=${state.textFocus} modal=${state.modal} tool=${state.mapTool} vertex=${state.vertex} history=${state.history} last=${state.last}`}
    function cycle(d){const vs=["A","B","C"],i=vs.indexOf(state.variant);state.variant=vs[(i+d+3)%3];state.tour=state.variant==="A";state.step=1;history.replaceState(null,"",`?variant=${state.variant}`);state.last=`切换到方案 ${state.variant}`;render()}
    document.addEventListener("click",e=>{const t=e.target.closest("[data-action]");if(!t)return;const a=t.dataset.action;if(a==="prev")return cycle(-1);if(a==="next")return cycle(1);if(a==="tour-next"){state.step=Math.min(5,state.step+1);state.last=`引导第 ${state.step} 步`;return render()}if(a==="tour-back"){state.step=Math.max(1,state.step-1);return render()}if(a==="skip-tour"||a==="finish-tour"){state.tour=false;state.last=a==="skip-tour"?"已跳过引导，可从 F1 或 ? 重开":"已完成首次运行引导";return render()}if(a==="reopen"){state.settings=false;state.tour=true;state.step=1;if(state.variant!=="A")state.variant="A";state.last="重新打开首次运行引导";return render()}if(a==="settings"){state.settings=true;state.settingsTab="shortcuts";state.modal=true;state.last="打开设置";return render()}if(a==="close-settings"){state.settings=false;state.modal=false;state.last="关闭设置";return render()}if(a==="settings-tab"){state.settingsTab=t.dataset.tab;return render()}if(a==="context"){state.context=t.dataset.context;state.mapTool="none";state.vertex=false;state.history=state.context==="campus"?0:2;state.last=`模拟 ${t.textContent} 上下文`;return render()}if(a==="toggle-text"){state.textFocus=!state.textFocus;return render()}if(a==="toggle-modal"){state.modal=!state.modal;return render()}if(a==="toggle-tool"){state.mapTool=state.mapTool==="adjust"?"none":"adjust";if(state.mapTool==="none")state.vertex=false;return render()}if(a==="toggle-vertex"){state.vertex=!state.vertex;return render()}if(a==="test-key")return testKey(t.dataset.key);if(a==="dismiss-toast"){state.toast="";return render()}if(a==="confirm-campus"){state.context="project";state.history++;return showToast("Campus Target 已确认；现在可以选择、新建或导入该校区下的项目。",false)}if(a==="dismiss-tip")return showToast("提示已收起；该操作下次仍会在不可用时解释原因。",false);if(a==="quickshots")return showToast("打开三张内置截图速览（原型未展开）。",false);if(a==="start-campus"){state.variant="B";state.tour=false;history.replaceState(null,"","?variant=B");return render()}});
    window.addEventListener("keydown",e=>{if(e.key==="F1"){e.preventDefault();state.variant="A";state.tour=true;state.step=1;state.settings=false;state.modal=false;return render()}if(e.key==="ArrowLeft"&&!state.settings)cycle(-1);if(e.key==="ArrowRight"&&!state.settings)cycle(1);if(e.key==="Escape"&&state.settings){state.settings=false;state.modal=false;return render()}if((e.ctrlKey&&e.key.toLowerCase()==="s")||(e.ctrlKey&&e.key.toLowerCase()==="z")||e.key==="Delete"||(e.ctrlKey&&e.key==="Enter")||e.key==="Escape"){e.preventDefault();const key=e.ctrlKey&&e.key.toLowerCase()==="s"?"Ctrl+S":e.ctrlKey&&e.key.toLowerCase()==="z"?"Ctrl+Z":e.key==="Delete"?"Delete":e.ctrlKey&&e.key==="Enter"?"Ctrl+Enter":"Esc";testKey(key)}});
    render();
  </script>
</body>
</html>
