<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Coarse Raster Supplement Prototype</title>
  <style>
    :root{--ink:#18241f;--muted:#65716b;--paper:#f6f1e5;--panel:#fffdf7;--line:#d9d2c3;--green:#1f5b46;--green2:#dfece4;--amber:#bf7921;--amber2:#fff1d5;--red:#a84b3f;--blue:#dcecf1;--shadow:0 10px 28px rgba(24,36,31,.12)}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.35 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}button{font:inherit;color:inherit;border:1px solid var(--line);background:#fffdf7;border-radius:8px;padding:8px 12px;cursor:pointer}button:hover:not(:disabled){border-color:var(--green);background:#f5fbf7}button:disabled{opacity:.48;cursor:not-allowed}.primary{background:var(--green);border-color:var(--green);color:white}.danger{color:var(--red);border-color:#dfc3bd}.ghost{background:transparent}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}.tiny{font-size:12px}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center}.stack{display:flex;flex-direction:column;gap:10px}.spacer{flex:1}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#ede9df;font-size:11px;font-weight:650}.pill.good{background:var(--green2);color:var(--green)}.pill.warn{background:var(--amber2);color:#87520e}.pill.bad{background:#f6dfdc;color:var(--red)}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.banner{height:26px;background:#10271f;color:#f7f3e9;text-align:center;font-size:11px;letter-spacing:.04em;padding:5px}.appbar{height:68px;background:#f7f0e1;border-bottom:1px solid #243a31;display:flex;align-items:center;padding:0 22px;gap:16px}.brand{font-size:21px;font-weight:800;padding-right:16px;border-right:1px solid var(--line)}.crumb{color:var(--muted)}.saved{color:var(--green);font-size:12px;font-weight:700}.switcher{position:fixed;z-index:50;left:50%;bottom:14px;transform:translateX(-50%);height:48px;min-width:340px;padding:6px;background:#10271f;color:white;border-radius:26px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;box-shadow:0 9px 24px rgba(0,0,0,.24)}.switcher button{height:36px;width:36px;border-radius:50%;background:#24483b;color:white;border:0;padding:0}.switch-label{text-align:center}.debug{position:fixed;left:10px;bottom:10px;z-index:55;width:310px;background:rgba(255,255,255,.91);border:1px dashed #999;padding:7px;font:10px/1.3 Consolas,monospace;color:#555}
    .map{position:relative;overflow:hidden;background:#e7e7dc}.map svg{width:100%;height:100%;display:block}.map-badge{position:absolute;right:12px;top:12px;background:#16392e;color:white;padding:7px 10px;border-radius:18px;font-size:11px}.legend{position:absolute;left:12px;bottom:10px;background:rgba(255,253,247,.94);padding:7px 9px;border:1px solid var(--line);border-radius:9px;font-size:11px}.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px}.callout{padding:10px 12px;border-left:4px solid var(--amber);background:var(--amber2);border-radius:6px}.contract{display:grid;grid-template-columns:1fr 1fr;gap:7px}.contract>div{padding:8px;background:#f2eee4;border-radius:7px}.contract strong{display:block;font-size:11px;margin-bottom:2px}.source{padding:9px;border:1px solid var(--line);border-radius:8px;background:#faf7ee}.source strong{font-size:12px}.gap-button{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:8px;text-align:left;align-items:center;padding:10px}.gap-button.active{outline:2px solid var(--green);background:#edf5ef}.gap-icon{width:32px;height:32px;border-radius:9px;background:#e9e3d5;display:grid;place-items:center;font-size:16px}.state-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block}.state-dot.accepted{background:var(--green)}.state-dot.rejected{background:var(--red)}.no-direct{padding:9px;border:1px dashed #b8aa8b;background:#fbf6e9;border-radius:8px;font-size:11px}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action-grid .wide{grid-column:1/-1}
    .a-shell{height:calc(100vh - 94px);display:grid;grid-template-columns:250px minmax(430px,1fr) 320px;padding-bottom:132px}.a-left,.a-right{padding:16px;overflow:auto;background:#f7f1e5}.a-left{border-right:1px solid var(--line)}.a-right{border-left:1px solid var(--line)}.a-center{display:grid;grid-template-rows:48px 1fr;min-width:0;min-height:0}.a-center-head{padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line)}.a-footer{position:fixed;z-index:20;left:250px;right:320px;bottom:72px;height:54px;background:rgba(255,253,247,.97);border:1px solid var(--line);display:flex;align-items:center;padding:8px 14px;gap:10px;box-shadow:0 -5px 18px rgba(24,36,31,.08)}
    .b-shell{height:calc(100vh - 94px);padding:14px 18px 128px;display:grid;grid-template-rows:48px 1fr;gap:10px}.b-head{display:flex;align-items:center}.b-main{min-height:0;display:grid;grid-template-columns:220px 1fr;gap:12px}.b-queue{padding:12px;overflow:auto}.b-compare{display:grid;grid-template-rows:1fr 178px;min-width:0;min-height:0;overflow:hidden}.compare-maps{display:grid;grid-template-columns:1fr 1fr;min-height:0;overflow:hidden}.compare-pane{position:relative;min-width:0;min-height:0;border-right:1px solid #fff;overflow:hidden}.compare-pane .map{height:100%}.compare-title{position:absolute;z-index:3;left:12px;top:12px;background:rgba(255,253,247,.95);border:1px solid var(--line);padding:8px 10px;border-radius:9px;font-weight:750}.b-detail{display:grid;grid-template-columns:1.2fr 1fr auto;gap:14px;padding:13px 15px;background:var(--panel);border-top:1px solid var(--line);min-height:0}.b-actions{display:flex;flex-direction:column;gap:7px;justify-content:center}.b-footer{position:fixed;left:18px;right:18px;bottom:74px;height:48px;background:rgba(255,253,247,.97);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;align-items:center;padding:8px 12px;gap:12px}
    .c-shell{height:calc(100vh - 94px);padding:14px 18px 78px;display:grid;grid-template-columns:210px minmax(480px,1fr) 300px;gap:12px}.c-steps,.c-side{padding:14px;overflow:auto}.step{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer}.step.active{background:#edf5ef;border-radius:9px}.step-num{width:26px;height:26px;border-radius:50%;background:#e4ded0;display:grid;place-items:center;font-weight:800}.step.active .step-num{background:var(--green);color:white}.c-work{display:grid;grid-template-rows:56px 1fr 155px;min-width:0}.c-work-head{padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}.c-table{padding:12px;background:var(--panel);border-top:1px solid var(--line);overflow:auto}.rule-table{width:100%;border-collapse:collapse;font-size:12px}.rule-table th,.rule-table td{text-align:left;padding:6px 8px;border-bottom:1px solid #e7e0d3}.rule-table th{color:var(--muted)}.c-side .action-grid{margin-top:12px}
    @media(max-width:1000px){.a-shell{grid-template-columns:220px 1fr}.a-right{display:none}.a-footer{left:220px;right:0}.c-shell{grid-template-columns:190px 1fr}.c-side{display:none}.b-detail{grid-template-columns:1fr auto}.b-detail>:nth-child(2){display:none}}
  </style>
</head>
<body>
  <div class="banner">THROWAWAY PROTOTYPE · 示例阈值不代表最终算法 · 不连接真实影像服务 · 粗栅格永远不是精确地物边界</div>
  <header class="appbar">
    <div class="brand">MC 校园复刻</div>
    <div class="crumb">华东师范大学普陀校区 / 普陀校区主复刻 / Foundation / 粗证据补缺</div>
    <div class="spacer"></div>
    <div class="saved">● 已保存 · 17:28</div>
    <button>设置</button>
  </header>
  <div id="app"></div>
  <div class="switcher">
    <button data-action="prev" aria-label="上一个方案">←</button>
    <div class="switch-label"><strong id="variantLabel">A</strong> — <span id="variantName">证据对照台</span></div>
    <button data-action="next" aria-label="下一个方案">→</button>
  </div>
  <div class="debug" id="debug"></div>
  <script>
    const names={A:"证据对照台",B:"左右证据对比",C:"四步契约检查"};
    const gaps=[
      {id:"water-nw",type:"水域",icon:"≈",title:"西北区域可能存在大面积水体",source:"Sentinel-2 L2A",date:"2026-06-21",resolution:"10 m",klass:"NDWI 水体迹象",pixels:31,area:"约 3,100 m²",confidence:"中等",state:"pending",structured:"OSM 完整 / Overture 局部缺失",reason:"仅在结构化覆盖报告标记的缺口内提出。连续像元足够大，但边缘只能表达约略范围。",bundle:"raster-s2-2026-06-21-v1",digest:"sha256:8bd…a91"},
      {id:"trees-east",type:"植被",icon:"♧",title:"东侧连续树木覆盖",source:"ESA WorldCover",date:"2021",resolution:"10 m",klass:"Tree cover · class 10",pixels:46,area:"约 4,600 m²",confidence:"较高",state:"accepted",structured:"OSM 部分 / Overture 无对应面",reason:"可作为连续植被覆盖的粗证据，不创建单棵树，也不替换已有绿地几何。",bundle:"worldcover-2021-v200",digest:"sha256:27a…ee4"},
      {id:"grass-south",type:"地表覆盖",icon:"▧",title:"南侧草地覆盖迹象",source:"ESA WorldCover",date:"2021",resolution:"10 m",klass:"Grassland · class 30",pixels:18,area:"约 1,800 m²",confidence:"中等",state:"rejected",structured:"结构化来源无对象；覆盖缺口已登记",reason:"与体育场结构化面局部重叠，不能覆盖体育设施；当前示例已拒绝。",bundle:"worldcover-2021-v200",digest:"sha256:416…1ce"}
    ];
    const state={variant:new URLSearchParams(location.search).get("variant")||"A",selected:"water-nw",view:"simplified",step:1,last:"等待审核粗栅格观察",history:0};
    function current(){return gaps.find(x=>x.id===state.selected)}
    function stateText(v){return v==="accepted"?"已接受为粗证据":v==="rejected"?"已拒绝":"待审核"}
    function stateClass(v){return v==="accepted"?"good":v==="rejected"?"bad":"warn"}
    function setVariant(v){state.variant=v;history.replaceState(null,"",`?variant=${v}`);render()}
    function cycle(d){const vs=["A","B","C"],i=vs.indexOf(state.variant);setVariant(vs[(i+d+vs.length)%vs.length]);state.last=`切换到方案 ${state.variant}`;render()}
    function gapList(compact=false){return gaps.map(g=>`<button class="gap-button ${g.id===state.selected?"active":""}" data-action="select" data-id="${g.id}"><span class="gap-icon">${g.icon}</span><span><strong>${g.title}</strong><span class="tiny muted" style="display:block">${g.source} · ${g.resolution}</span></span><span class="pill ${stateClass(g.state)}">${compact?stateText(g.state).replace("已接受为粗证据","已接受"):stateText(g.state)}</span></button>`).join("")}
    function sources(){const g=current();return `<div class="source"><div class="row"><strong>结构化覆盖报告</strong><span class="spacer"></span><span class="pill warn">存在缺口</span></div><div class="tiny muted">${g.structured}</div></div><div class="source"><div class="row"><strong>${g.source}</strong><span class="spacer"></span><span class="pill">${g.resolution} 像元</span></div><div class="tiny muted">${g.date} · ${g.klass}</div></div>`}
    function contract(){const g=current();return `<div class="contract"><div><strong>原始像元</strong>${g.pixels} 个连续像元</div><div><strong>约略面积</strong>${g.area}</div><div><strong>置信标记</strong>${g.confidence} · 非测量级</div><div><strong>空间限制</strong>校区边界 ∩ 已知缺口</div><div><strong>简化规则</strong>示例：10 m 容差</div><div><strong>覆盖优先级</strong>永不覆盖结构化几何</div></div>`}
    function actions(){const g=current();return `<div class="action-grid"><button class="primary" data-action="accept">接受为粗证据</button><button class="danger" data-action="reject">拒绝观察</button><button class="wide" data-action="defer">保留缺口，稍后处理</button></div>`}
    function lineage(){const g=current();return `<div class="stack"><div><div class="eyebrow">Source Lineage</div><strong>${g.bundle}</strong></div><div class="tiny"><strong>Dataset / acquisition</strong><br>${g.source} · ${g.date} · ${g.resolution}</div><div class="tiny"><strong>Class / threshold / algorithm</strong><br>${g.klass} · 阈值示例 v0.3 · connected-components-v1</div><div class="tiny"><strong>Geo transform / digest</strong><br>EPSG:32651 · 10 m affine grid · ${g.digest}</div></div>`}
    function mapSvg(mode="both"){
      const showCells=mode!=="structured"&&(state.view==="raw"||mode==="raster");
      const showShape=mode!=="structured"&&(state.view==="simplified"||mode==="raster");
      return `<div class="map"><svg viewBox="0 0 760 500" role="img" aria-label="粗栅格观察地图"><defs><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#d2d1c7" stroke-width="1"/></pattern></defs><rect width="760" height="500" fill="#e8e8dd"/><rect width="760" height="500" fill="url(#grid)"/><path d="M10 334 C170 296,345 338,480 304 S690 266,760 280" fill="none" stroke="white" stroke-width="18"/><path d="M102 104 L615 70 L692 393 L128 438 Z" fill="none" stroke="#456b5d" stroke-width="4" stroke-dasharray="9 7"/><text x="330" y="450" font-size="13" fill="#56665f">华东师范大学普陀校区</text><g fill="#c7b99c" stroke="#a99c83"><rect x="170" y="138" width="94" height="62" rx="4"/><rect x="302" y="108" width="100" height="76" rx="4"/><rect x="500" y="180" width="118" height="74" rx="4"/><rect x="263" y="348" width="92" height="55" rx="4"/></g><path d="M455 116 L595 102 L620 210 L468 226 Z" fill="#dbe7d4" stroke="#47725d" stroke-width="4"/><rect x="478" y="137" width="96" height="58" rx="28" fill="#d9caa6" stroke="#a98d59"/>${showCells?`<g fill="#4a9db3" fill-opacity=".52" stroke="#2f7181" stroke-width="1">${Array.from({length:31},(_,i)=>{const x=110+(i%7)*26,y=218+Math.floor(i/7)*26;return `<rect x="${x}" y="${y}" width="25" height="25"/>`}).join("")}</g>`:""}${showShape?'<path d="M105 214 L282 217 L291 287 L255 330 L130 325 L98 279 Z" fill="#4a9db3" fill-opacity=".35" stroke="#166b7d" stroke-width="6" stroke-linejoin="round"/><path d="M105 214 L282 217 L291 287 L255 330 L130 325 L98 279 Z" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="7 6"/>':""}<path d="M90 205 H310 V342 H90 Z" fill="none" stroke="#be7920" stroke-width="3" stroke-dasharray="8 5"/><text x="94" y="195" font-size="12" fill="#8a5414">结构化覆盖缺口</text></svg><div class="map-badge">${mode==="structured"?"仅结构化证据":showCells?"原始 10 m 像元":"简化后的约略范围"}</div><div class="legend"><i style="background:#bf7921"></i>覆盖缺口　<i style="background:#4a9db3"></i>粗栅格观察　<i style="background:#47725d"></i>结构化对象</div></div>`
    }
    function variantA(){const g=current();return `<main class="a-shell"><aside class="a-left"><div class="eyebrow">粗证据队列</div><h2 style="margin:4px 0">只补结构化缺口</h2><p class="tiny muted">大范围水域、植被和地表覆盖可提出观察；建筑、道路、单棵树和精细边线不可提出。</p><div class="stack">${gapList()}</div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="eyebrow">两条硬规则</div><div class="no-direct">① 不能覆盖 OSM/Overture 明确几何。<br>② 接受后仍只是 Coarse Raster Observation，不直接进入生成模型。</div></aside><section class="a-center"><div class="a-center-head row"><div><strong>${g.title}</strong><div class="tiny muted">${g.klass} · ${g.pixels} pixels</div></div><span class="spacer"></span><button data-action="raw">原始像元</button><button data-action="simplified">约略范围</button></div>${mapSvg()}</section><aside class="a-right"><div class="eyebrow">证据契约</div><h2 style="margin:4px 0">${g.type}粗观察</h2><div class="stack">${sources()}${contract()}${lineage()}<div class="no-direct"><strong>持久化结果</strong><br>原始栅格引用 + geo transform + 参数 + 简化面 + 置信度 + 审核决定；不伪装成 Reviewed Feature Geometry。</div>${actions()}</div></aside><footer class="a-footer"><span class="pill ${stateClass(g.state)}"><span class="state-dot ${g.state}"></span>${stateText(g.state)}</span><strong>${g.type}缺口仍保留</strong><span class="tiny muted">接受粗证据不会自动“解决”缺口；边缘可能偏差至少一个 10 m 像元</span><span class="spacer"></span><button data-action="next-gap">保存决定并查看下一项</button></footer></main>`}
    function variantB(){const g=current();return `<main class="b-shell"><div class="b-head"><div><div class="eyebrow">并排比较</div><h1 style="font-size:23px;margin:0">它补充了什么，而不是“识别出了什么”</h1></div><span class="spacer"></span><span class="pill warn">${g.resolution} · ${g.confidence}置信</span></div><div class="b-main"><aside class="b-queue card"><div class="eyebrow">观察队列</div><div class="stack" style="margin-top:8px">${gapList(true)}</div><div class="no-direct" style="margin-top:10px">左右地图使用同一视口。右侧蓝色只是证据覆盖，不是可直接编辑或导出的地物。</div></aside><section class="b-compare card"><div class="compare-maps"><div class="compare-pane"><div class="compare-title">① 结构化来源已有内容</div>${mapSvg("structured")}</div><div class="compare-pane"><div class="compare-title">② 加入粗栅格观察</div>${mapSvg("raster")}</div></div><div class="b-detail"><div><div class="eyebrow">${g.type} · ${stateText(g.state)}</div><h2 style="margin:3px 0">${g.title}</h2><div class="callout tiny">${g.reason}</div></div><div>${contract()}</div><div class="b-actions"><button class="primary" data-action="accept">接受为粗证据</button><button class="danger" data-action="reject">拒绝</button><button data-action="lineage">来源详情</button></div></div></section></div><footer class="b-footer"><strong>保存内容：</strong><span class="tiny">Dataset Bundle、原始像元引用、地理变换、算法参数、约略面、置信度、决定和缺口关联</span><span class="spacer"></span><span class="pill bad">不保存为精确边界</span></footer></main>`}
    function stepContent(){const g=current();if(state.step===1)return `<div class="callout"><strong>门槛：先有结构化覆盖缺口</strong><div class="tiny">${g.structured}。没有缺口时，栅格流程不能提出任何候选。</div></div>`;if(state.step===2)return sources();if(state.step===3)return contract();return `<div class="stack"><div class="callout"><strong>用户看到的固定警告</strong><div class="tiny">这是 ${g.resolution} 分辨率的约略覆盖证据，不是精确边界；接受后仍需在 Minecraft/Axiom 中修整细节。</div></div>${actions()}</div>`}
    function variantC(){const g=current();return `<main class="c-shell"><aside class="c-steps card"><div class="eyebrow">四步契约检查</div><h2 style="margin:4px 0 8px">每项观察都要过四关</h2>${[["确认缺口","结构化来源先报告缺口"],["固定数据","日期、分辨率与类别"],["检查简化","阈值、范围与优先级"],["人工决定","警告、接受或拒绝"]].map((s,i)=>`<div class="step ${state.step===i+1?"active":""}" data-action="step" data-step="${i+1}"><span class="step-num">${i+1}</span><span><strong>${s[0]}</strong><span class="tiny muted" style="display:block">${s[1]}</span></span></div>`).join("")}<div class="no-direct" style="margin-top:12px">任一步缺失，观察不能进入 Foundation Review Ledger。</div></aside><section class="c-work card"><div class="c-work-head row"><div><div class="eyebrow">当前检查 · ${state.step}/4</div><strong>${g.title}</strong></div><span class="spacer"></span><button data-action="raw">原始像元</button><button data-action="simplified">约略范围</button></div>${mapSvg()}<div class="c-table"><table class="rule-table"><thead><tr><th>可提出</th><th>不可提出</th><th>覆盖规则</th></tr></thead><tbody><tr><td>大型水体覆盖</td><td>窄河岸精确线</td><td>只在缺口内</td></tr><tr><td>连续树木/植被覆盖</td><td>单棵树或树冠边线</td><td>不覆盖结构化面</td></tr><tr><td>大块草地等地表覆盖</td><td>建筑、道路、体育设施</td><td>不直接进入生成</td></tr></tbody></table></div></section><aside class="c-side card"><div class="eyebrow">本步解释</div><h2 style="margin:4px 0">${["","先证明需要补","再固定可复现数据","把算法边界说清楚","最后由用户决定"][state.step]}</h2><div class="stack">${stepContent()}${lineage()}</div><div class="row" style="margin-top:12px"><button data-action="back-step" ${state.step===1?"disabled":""}>上一步</button><button class="primary" data-action="next-step" ${state.step===4?"disabled":""}>下一步</button></div></aside></main>`}
    function decide(next){const g=current();g.state=next;state.history++;state.last=`${g.title} → ${stateText(next)}`;render()}
    function render(){document.getElementById("app").innerHTML=state.variant==="A"?variantA():state.variant==="B"?variantB():variantC();document.getElementById("variantLabel").textContent=state.variant;document.getElementById("variantName").textContent=names[state.variant];const g=current();document.getElementById("debug").textContent=`PROTOTYPE STATE variant=${state.variant} selected=${g.id} view=${state.view} step=${state.step} decision=${g.state} history=${state.history} last=${state.last}`}
    document.addEventListener("click",e=>{const t=e.target.closest("[data-action]");if(!t)return;const a=t.dataset.action;if(a==="prev")return cycle(-1);if(a==="next")return cycle(1);if(a==="select"){state.selected=t.dataset.id;state.last=`选择 ${current().title}`;return render()}if(a==="raw"){state.view="raw";state.last="查看原始 10 m 像元";return render()}if(a==="simplified"){state.view="simplified";state.last="查看简化后的约略范围";return render()}if(a==="accept")return decide("accepted");if(a==="reject")return decide("rejected");if(a==="defer"){state.last="保留 Known Feature Gap，稍后处理";state.history++;return render()}if(a==="next-gap"){const i=gaps.indexOf(current());state.selected=gaps[(i+1)%gaps.length].id;state.last="保存决定并查看下一项";return render()}if(a==="lineage"){state.last=`来源详情：${current().bundle} / ${current().digest}`;return render()}if(a==="step"){state.step=Number(t.dataset.step);state.last=`进入契约第 ${state.step} 步`;return render()}if(a==="back-step"){state.step=Math.max(1,state.step-1);return render()}if(a==="next-step"){state.step=Math.min(4,state.step+1);return render()}});
    window.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1)});
    render();
  </script>
</body>
</html>
