[package]
name = "campus-native"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
arnis-core = { path = "../../../src-tauri/crates/arnis-core" }
campus-export = { path = "../../crates/campus-export" }
campus-services = { path = "../../crates/campus-services" }
campus-state = { path = "../../crates/campus-state" }
campus-tool-protocol = { path = "../../crates/campus-tool-protocol" }
rand = "0.9"
rfd = "0.15"
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
slint = { version = "1.16.1", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2", "std"] }
tokio = { version = "1", features = ["io-util", "net", "rt"] }

[build-dependencies]
slint-build = "1.16.1"
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
